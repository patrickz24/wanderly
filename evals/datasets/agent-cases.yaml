# Agent evaluation cases (plan section 8.1). Loaded and validated by evals/runner/agent-dataset.ts.
#
# Ground truth comes from the corpus, never from a model's output:
# - destination ids, aliases and place titles from data/destinations.yaml and data/corpus/*/facts.yaml;
# - every expected interest is a POI kind the destination has at least 3 POIs of (checked by the loader);
# - unknown destinations are real places that match no destination id, name, alias or place title
#   of the corpus (checked by the loader);
# - expected constraints (duration, month, travellers, budget level) are the ones the user states.
#
# `expect` applies to the response of the LAST turn; earlier turns of a multi-turn case run through
# the agent first (same conversation, brief carried over as the API does).
# `poison` (indirect injection only) is an eval-only document injected at rank 1 into the results of
# search_knowledge for that destination. It never touches the real corpus.
#
# Provenance: every case was proposed by the build agent and awaits a human review (plan 8.1).
version: 1
today: '2026-10-10'
cases:
