# Retrieval evaluation dataset (milestone 2).
#
# Each query is labelled with the sections of the corpus that answer it, as
# (destinationId, document, headingPath) targets: `document` is relative to
# data/corpus/<destinationId>/ and `headingPath` is the section path inside the
# document, without the document title ("Do > Hiking"). Labels name sections,
# never chunk ids, so they survive re-chunking: a retrieved chunk is relevant
# when one of the sections it covers is the target or one of its subsections.
#
# `destinationId` on a query is the retrieval filter the agent would pass
# (null = search every destination). `style` describes the phrasing:
# keyword, paraphrase (no shared key terms), question, or cross-section
# (the answer is spread over several sections or documents).
#
# Provenance: every query and label was proposed by the build agent from the
# corpus text and is pending human review. They are not written by the
# person who owns the evaluation yet; see docs/EVALUATIONS.md, "Limitations".

