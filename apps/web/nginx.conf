# Wanderly web container (nginx-unprivileged, non-root, port 8080).
# Installed as /etc/nginx/conf.d/default.conf, i.e. inside the image's `http {}` block.
#
# - Serves the Vite build (SPA fallback to index.html).
# - Reverse-proxies /api, /health and /ready to the API, so the browser stays same-origin.
# - TLS and HSTS are terminated by the hosting edge (milestone 7), not here.

upstream wanderly_api {
    # Compose service name; resolved when nginx starts (web depends_on api being healthy).
    server api:3000;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Above the API body limit (64 KiB) so the API answers oversized bodies with its JSON error
    # envelope; nginx only stops grossly oversized uploads.
    client_max_body_size 128k;

    # Compression for static text assets. text/event-stream is deliberately absent: compressing
    # an SSE stream makes gzip buffer events until its window fills.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript text/javascript application/json
               image/svg+xml application/manifest+json;

    # ------------------------------------------------------------------------------------------
    # API reverse proxy
    # ------------------------------------------------------------------------------------------
    # No add_header here: the API (helmet) sets its own security and cache headers.
    location /api/ {
        proxy_pass http://wanderly_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Correlates nginx and API logs (the API reuses a well-formed X-Request-ID).
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-Host $host;

        # Server-Sent Events (POST /api/conversations/:id/messages): forward each event as soon
        # as the API writes it; never buffer, cache or compress the stream.
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        # An agent run is capped at AGENT_RUN_DEADLINE_MS (90 s); keep a margin above it.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_connect_timeout 5s;
    }

    location ~ ^/(health|ready)$ {
        proxy_pass http://wanderly_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Correlates nginx and API logs (the API reuses a well-formed X-Request-ID).
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 10s;
        proxy_connect_timeout 5s;
        access_log off;
    }

    # ------------------------------------------------------------------------------------------
    # Static files
    # ------------------------------------------------------------------------------------------
    # nginx pitfall: a location that declares any add_header drops every add_header inherited
    # from the server level, so each static location lists its full header set.

    # Fingerprinted bundles (Vite emits /assets/<name>-<hash>.<ext>): cache forever. A missing
    # asset is a real 404, never the SPA fallback (HTML served as JS would hide the error).
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    # Hidden source maps are kept for error-tracker upload, not served to browsers.
    location ~* \.map$ {
        return 404;
    }

    # SPA entry point and other public files: always revalidated so a deploy is picked up.
    location / {
        try_files $uri /index.html;

        add_header Cache-Control "no-cache" always;
        # Vite production builds have no inline scripts or styles. connect-src 'self' covers the
        # same-origin API and SSE; update it if VITE_API_BASE_URL ever points to another origin.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), browsing-topics=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }
}
