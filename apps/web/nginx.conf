# Wanderly web container (nginx-unprivileged, non-root, port 8080).
# Installed as an envsubst template (/etc/nginx/templates/default.conf.template): at startup the
# image entrypoint renders it to /etc/nginx/conf.d/default.conf, inside the `http {}` block.
# Only WANDERLY_* variables are substituted (NGINX_ENVSUBST_FILTER); defaults live in the
# Dockerfile, deployments override them (infra/fly/web.fly.toml).
#
# - Serves the Vite build (SPA fallback to index.html).
# - Reverse-proxies /api, /health and /ready to the API, so the browser stays same-origin.
# - TLS is terminated by the hosting edge (Fly.io proxy), not here.

upstream wanderly_api {
    # Compose: api:3000. Fly.io: <api-app>.flycast:80 (stable private address). Resolved once
    # when nginx starts.
    server ${WANDERLY_API_UPSTREAM};
    keepalive 16;
}

# Original scheme. Behind Fly.io, TLS ends at the edge proxy, which sets X-Forwarded-Proto; the
# header is only believed when the TCP peer is that trusted proxy (same CIDR as set_real_ip_from).
geo $realip_remote_addr $wanderly_via_trusted_proxy {
    default 0;
    ${WANDERLY_REAL_IP_FROM} 1;
}

map "$wanderly_via_trusted_proxy:$http_x_forwarded_proto" $wanderly_forwarded_proto {
    "1:https" https;
    default   $scheme;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Client IP. nginx is the trust boundary for the API: it resolves the real client address
    # once, then sends exactly that address upstream (X-Forwarded-For is overwritten, so a
    # client cannot inject entries). Behind Fly.io the edge proxy (connecting from
    # 172.16.0.0/16) sets Fly-Client-IP. The defaults only trust loopback, where no proxy runs,
    # so in compose the TCP peer is the client.
    real_ip_header ${WANDERLY_REAL_IP_HEADER};
    set_real_ip_from ${WANDERLY_REAL_IP_FROM};

    # Above the API body limit (64 KiB) so the API answers oversized bodies with its JSON error
    # envelope; nginx only stops grossly oversized uploads.
    client_max_body_size 128k;

    # Compression for static text assets. text/event-stream is deliberately absent: compressing
    # an SSE stream makes gzip buffer events until its window fills.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript text/javascript application/json
               image/svg+xml application/manifest+json;

    # ------------------------------------------------------------------------------------------
    # API reverse proxy
    # ------------------------------------------------------------------------------------------
    # No add_header here: the API (helmet) sets its own security and cache headers.
    location /api/ {
        proxy_pass http://wanderly_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $wanderly_forwarded_proto;
        # Correlates nginx and API logs (the API reuses a well-formed X-Request-ID).
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-Host $host;

        # Server-Sent Events (POST /api/conversations/:id/messages): forward each event as soon
        # as the API writes it; never buffer, cache or compress the stream.
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        # An agent run is capped at AGENT_RUN_DEADLINE_MS (90 s); keep a margin above it.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_connect_timeout 5s;
    }

    location ~ ^/(health|ready)$ {
        proxy_pass http://wanderly_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $wanderly_forwarded_proto;
        # Correlates nginx and API logs (the API reuses a well-formed X-Request-ID).
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 10s;
        proxy_connect_timeout 5s;
        access_log off;
    }

    # ------------------------------------------------------------------------------------------
    # Static files
    # ------------------------------------------------------------------------------------------
    # nginx pitfall: a location that declares any add_header drops every add_header inherited
    # from the server level, so each static location lists its full header set.

    # Fingerprinted bundles (Vite emits /assets/<name>-<hash>.<ext>): cache forever. A missing
    # asset is a real 404, never the SPA fallback (HTML served as JS would hide the error).
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    # Hidden source maps are kept for error-tracker upload, not served to browsers.
    location ~* \.map$ {
        return 404;
    }

    # SPA entry point and other public files: always revalidated so a deploy is picked up.
    location / {
        try_files $uri /index.html;

        add_header Cache-Control "no-cache" always;
        # Ignored by browsers over plain HTTP (local compose); effective behind the HTTPS edge.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # Vite production builds have no inline scripts or styles. connect-src 'self' covers the
        # same-origin API and SSE; update it if VITE_API_BASE_URL ever points to another origin.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), browsing-topics=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }
}
