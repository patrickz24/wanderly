      source: 'Wikivoyage GeoData of "Hvar"'
    substitution:
      requested: Dalmatia
      reason: >-
        The "Dalmatia" article is an outline whose See and Do sections hold 110 words in total at
        revision 4989248, with no listings. "Hvar" is a usable-status article about a Dalmatian island
