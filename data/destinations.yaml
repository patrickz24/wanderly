# Wanderly destination list: the single input of the corpus scripts (see data/README.md).
#
# - id: stable kebab-case slug, used as the corpus directory name and as the POI id prefix.
# - wikivoyage_title: canonical English Wikivoyage page title (no redirects; the fetcher rejects them).
# - aliases: other names a traveller may type (French, local, alternative English spellings).
# - climate_point: coordinates used for the Open-Meteo climate normals. By default the article's own
#   Wikivoyage GeoData point. It is replaced by the GeoData point of the main gateway city when the
#   article point is at sea (DEM elevation 0 m) or above 500 m in a destination that visitors mostly
#   experience lower down. Elevations were read from the Open-Meteo elevation API (90 m DEM).
# - substitution: present when the requested destination was replaced, with the reason. Rule: the
#   page (or the page it redirects to) is missing, or is an outline whose See + Do sections hold
#   fewer than 150 words once converted (the "almost no See/Do content" case). Word counts come
#   from data/scripts/wikitext.ts on the revision quoted in the reason.
# - note: present when the requested name maps to a page whose scope differs.
# - places: up to 4 place articles (cities, towns, islands, parks) whose listings feed the POIs and
#   costs. Written by `select-places.ts --write` with the rule of data/scripts/places.ts: pages
#   linked from the region article's destination-listing sections, city/park/rural-area articles
#   with >= 3 priced Sleep/Eat listings or >= 5 See/Do listings, ranked by priced listings under
#   Budget/Mid-range/Splurge, then priced listings, then See/Do listings, then title. The ranking
#   of every candidate is in data/places-selection.md. Do not edit by hand: rerun the selection.
destinations:
  - id: sicily
    name: Sicily
    country: Italy
    wikivoyage_title: Sicily
    aliases: [Sicile, Sicilia]
    climate_point:
      lat: 38.116667
      lon: 13.366667
      source: 'Wikivoyage GeoData of "Palermo" (main gateway); the "Sicily" point (37.5, 14) is inland at 555 m'
    places:
      - id: catania
        title: Catania
      - id: syracuse-italy
        title: Syracuse (Italy)
      - id: palermo
        title: Palermo
      - id: agrigento
