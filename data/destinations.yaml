# Wanderly destination list: the single input of the corpus scripts (see data/README.md).
#
# - id: stable kebab-case slug, used as the corpus directory name and as the POI id prefix.
# - wikivoyage_title: canonical English Wikivoyage page title (no redirects; the fetcher rejects them).
# - aliases: other names a traveller may type (French, local, alternative English spellings).
# - climate_point: coordinates used for the Open-Meteo climate normals. By default the article's own
#   Wikivoyage GeoData point. It is replaced by the GeoData point of the main gateway city when the
#   article point is at sea (DEM elevation 0 m) or above 500 m in a destination that visitors mostly
#   experience lower down. Elevations were read from the Open-Meteo elevation API (90 m DEM).
# - substitution: present when the requested destination was replaced, with the reason. Rule: the
#   page (or the page it redirects to) is missing, or is an outline whose See + Do sections hold
#   fewer than 150 words once converted (the "almost no See/Do content" case). Word counts come
#   from data/scripts/wikitext.ts on the revision quoted in the reason.
# - note: present when the requested name maps to a page whose scope differs.
destinations:
  - id: sicily
    name: Sicily
    country: Italy
    wikivoyage_title: Sicily
    aliases: [Sicile, Sicilia]
    climate_point:
      lat: 38.116667
      lon: 13.366667
      source: 'Wikivoyage GeoData of "Palermo" (main gateway); the "Sicily" point (37.5, 14) is inland at 555 m'

  - id: sardinia
    name: Sardinia
    country: Italy
    wikivoyage_title: Sardinia
    aliases: [Sardaigne, Sardegna, Sardigna]
    climate_point:
      lat: 39.246389
      lon: 9.0575
      source: 'Wikivoyage GeoData of "Cagliari" (main gateway); the "Sardinia" point (40.1, 9) is inland at 629 m'

  - id: apulia
    name: Apulia
    country: Italy
    wikivoyage_title: Apulia
    aliases: [Puglia, Pouilles]
    climate_point:
      lat: 41.008611
      lon: 16.512778
      source: 'Wikivoyage GeoData of "Apulia" (334 m, on the Murge plateau)'

  - id: tuscany
    name: Tuscany
    country: Italy
    wikivoyage_title: Tuscany
    aliases: [Toscane, Toscana]
    climate_point:
      lat: 43.35
      lon: 11.01666667
      source: 'Wikivoyage GeoData of "Tuscany"'

  - id: seiser-alm
    name: Seiser Alm
    country: Italy
    wikivoyage_title: Seiser Alm
    aliases: [Alpe di Siusi, Alpe de Siusi, Mont Sëuc]
    climate_point:
      lat: 46.54111
      lon: 11.64472
      source: 'Wikivoyage GeoData of "Seiser Alm" (a mountain plateau: its 1,863 m point is representative)'
    substitution:
      requested: Dolomites
      reason: >-
        "Dolomites" redirects to "South Tyrol", an outline region article whose See and Do sections
        hold 37 words in total at revision 5266223 (a name-only list of sights, empty Do). "Seiser Alm" is a usable-status rural-area article about the largest alpine plateau of
        the South Tyrolean Dolomites, with 1,459 words of See and Do (hiking, climbing, biking,
        skiing) and 22 listings.

  - id: corsica
    name: Corsica
    country: France
    wikivoyage_title: Corsica
    aliases: [Corse, Île de Beauté]
    climate_point:
      lat: 41.9267
      lon: 8.7369
      source: 'Wikivoyage GeoData of "Ajaccio" (main gateway); the "Corsica" point (42.15, 9.0833) is in the mountains at 1,683 m'

  - id: provence
    name: Provence
    country: France
    wikivoyage_title: Provence-Alpes-Côte d'Azur
    aliases: [Provence-Alpes-Côte d'Azur, PACA, Région Sud]
    climate_point:
      lat: 43.526304
      lon: 5.445429
      source: 'Wikivoyage GeoData of "Aix-en-Provence"; the "Provence-Alpes-Côte d''Azur" point (44, 6) is in the Alps at 718 m'
    note: >-
      Wikivoyage redirects "Provence" to the regional article "Provence-Alpes-Côte d'Azur", which also
      covers the Côte d'Azur and the Southern Alps. Kept as the closest match.

  - id: andalusia
    name: Andalusia
