  - id: crete-rethymno-arkadi-monastery
    name: Arkadi Monastery
    kinds:
      - nature
      - museum
      - religious_site
    description: It has a museum and a gallery. The local people sacrificed themselves for freedom on this place on the November 8th, 1866 by blewing it up. It is southeast of Rethymno toward Heraklion, on a fertile plateau 23 km from the city. It is still inhabited by some monks and it still has its own Orthodox celebration days.
    crowd_level: null
    best_months: []
    source_ref: Rethymno > See
