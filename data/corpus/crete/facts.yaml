  - id: crete-rethymno-fortezza-of-rethymnon
    name: Fortezza of Rethymnon
    kinds:
      - historic_site
      - religious_site
    description: The preserverd fortified acropolis of the city. A mosque, though not operating, is still preserved, and so do a few other buildings and walls. Built on a small hill near the coast, it has a breathtaking view of the city and the sea.
    crowd_level: null
    best_months: []
