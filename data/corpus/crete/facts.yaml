  - id: crete-lasithi-plateau
    name: Lasithi Plateau
    kinds:
      - nature
      - historic_site
    description: A large fertile plateau in the centre of Lassithi Prefecture at an altitude of 840 meters (2,760 ft). Once, as many as 10,000 white-sailed windmills operated on the plateau, but these have largely been replaced by diesel and electric irrigation pumps. Numerous old stone windmills (some ruins, some beautifully restored) still stand along the passes above the plateau.
    crowd_level: null
    best_months: []
    source_ref: Other destinations
  - id: crete-vai-palm-forest
    name: Vai palm forest
    kinds:
      - nature
    description: The largest palm-forest of Europe, spanning 250 stremmata (Greek unit of surface equal with 1000m²) consisted by Phoenix theophrastii (Cretan palm), an indigenous species of palm.
    crowd_level: null
    best_months: []
    source_ref: Other destinations
