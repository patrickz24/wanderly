    description: Historic buildings. Rethimno has many historic buildings remaining from the Venetian occupation of Crete, including the Fortessa and the lighthouse.
    crowd_level: null
    best_months: []
    source_ref: Rethymno > See
  - id: crete-rethymno-boardwalk
    name: Boardwalk
    kinds:
      - food
      - nightlife
    description: Boardwalk. Walk around the very well-kept boardwalk by the sea. Plenty of bars and restaurants with great views of the sea.
    crowd_level: null
    best_months: []
    source_ref: Rethymno > See
  - id: crete-chania-etz-hayyim-synagogue
    name: Etz Hayyim Synagogue
    kinds:
      - historic_site
      - religious_site
    description: "Until 1999 Etz Hayyim was a house of prayer that remained the sole Jewish monument on Crete after the destruction of Crete's Jewish community in 1944. Essentially it stood as a monument to the success of the Nazis in obliterating 2,300 years of Jewish life on Crete. Between 1996 and the year of its rededication in 1999, the structure was painstakingly restored. The philosophy that directed this work is summed up in the Hebrew Am Israel Hayy: 'The people of Israel live'. It used to be on the World Monument Fund's list of most endangered sites."
    crowd_level: null
    best_months: []
    source_ref: Chania > See
