  - id: crete-monasteries-and-convents
    name: Monasteries and convents
    kinds:
      - religious_site
    description: Monasteries and convents. As true throughout Greece, the Cretan monastic tradition is strong. There are hundreds of monasteries and convents on the island, and most are open to visitors.
    crowd_level: null
    best_months: []
    source_ref: See
  - id: crete-churches
    name: Churches
    kinds:
      - historic_site
      - religious_site
      - village
    description: Churches. There are even more churches on Crete than monasteries. Even small villages will have a main church or two and several chapels. Many of the churches are open to visitors, especially the more historic ones in cities like Chania, Rethymnon, and Heraklion.
    crowd_level: null
    best_months: []
    source_ref: See
  - id: crete-architecture
    name: Architecture
    kinds:
      - historic_site
      - religious_site
    description: Architecture. Because of invasion and occupation over centuries, there is varied architecture to admire, including Venetian fortresses and castles, Byzantine churches, Roman aqueducts, and Turkish villas and baths. Examples can be found all over the island, but are primarily concentrated in and around the main port cities.
    crowd_level: null
    best_months: []
    source_ref: See
  - id: crete-scenery
    name: Scenery
    kinds:
      - nature
      - viewpoint
    description: Scenery. The scenery of this mountainous island is quite varied. The high mountains that stretch across the interior from east to west have blessed Crete with scenic valleys, dramatic gorges like the Gorge of Samaria, thousands of caves, rivers and lakes. The east end of the island is semi-arid, and the western end is more lush with forests. All of this scenery can be seen in a good day's drive.
    crowd_level: null
    best_months: []
    source_ref: See
  - id: crete-beaches
    name: Beaches
    kinds:
      - beach
      - nature
    description: Beaches. There are beautiful beaches all around the island, such as Agios Pavlos, Balos, Vai on the far eastern tip that has the largest palm (Cretan date palms) forest in Europe, uninhabited Chrysi Island off the coast of Ierapetra, which boasts the largest natural-growth Lebanese cedar forest in Europe, and the red sand beach of Matala made famous by the hippies who resided in caves here in the 1960s and 70s (and by the 1971 Joni Mitchell song "Carey"). You can also find official Nudist-Beaches, which is rare on other islands in Greece.
    crowd_level: null
    best_months: []
    source_ref: See
  - id: crete-traditional-villages
    name: Traditional villages
    kinds:
      - village
    description: Traditional villages. Head off the beaten path to discover traditional villages where life goes on much as it did hundreds of years ago.
    crowd_level: null
    best_months: []
