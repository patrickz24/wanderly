    description: Heraklion Sailing Club (Ιστιοπλοϊκός Όμιλος Ηρακλείου) offers sailing lessons, sailing trips, yacht charters and has its own seafood restaurant. It's on the former premises of the port refrigeration plant, east of the Port Authorities.
