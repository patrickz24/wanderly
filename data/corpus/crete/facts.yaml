pois:
  - id: crete-samaria-national-park
    name: Samaria National Park
    kinds:
      - hiking
      - nature
    description: A breathtaking gorge on the southern part of Chania Prefecture open for the 5- to 7-hour moderately strenuous hike from 1 May until mid-October.
    crowd_level: null
    best_months: []
    source_ref: Crete > Other destinations
  - id: crete-lasithi-plateau
    name: Lasithi Plateau
    kinds:
      - nature
      - historic_site
    description: A large fertile plateau in the centre of Lassithi Prefecture at an altitude of 840 meters (2,760 ft). Once, as many as 10,000 white-sailed windmills operated on the plateau, but these have largely been replaced by diesel and electric irrigation pumps. Numerous old stone windmills (some ruins, some beautifully restored) still stand along the passes above the plateau.
    crowd_level: null
    best_months: []
    source_ref: Crete > Other destinations
  - id: crete-vai-palm-forest
    name: Vai palm forest
    kinds:
      - nature
    description: The largest palm-forest of Europe, spanning 250 stremmata (Greek unit of surface equal with 1000m²) consisted by Phoenix theophrastii (Cretan palm), an indigenous species of palm.
    crowd_level: null
    best_months: []
    source_ref: Crete > Other destinations
  - id: crete-gramvousa
    name: Gramvousa
    kinds:
      - beach
    description: Small rocky island with marvellous beaches. Ferry connections from Kissamos.
    crowd_level: null
    best_months: []
    source_ref: Crete > Other destinations
  - id: crete-elafonisi
    name: Elafonisi
    kinds:
      - beach
    description: A small island with an impressive beach with crystal clear water and pink sand. Elafonisi is a favourite place for relaxing and swimming.
    crowd_level: null
    best_months: []
    source_ref: Crete > Other destinations
  - id: crete-heraklion-heraklion-archaeological-museum
    name: Heraklion Archaeological Museum
    kinds:
      - historic_site
      - museum
    description: Houses the most important and representative finds from Minoan civilisation and excavations across the island of Crete. Highlights include statues of the Snake Goddess, the Bull-Leaping Fresco, the Phaistos Disk, and Minoan seals and jewellery. Also includes a number of finds from Classical Greek and Roman periods.
    crowd_level: null
    best_months: []
    source_ref: Heraklion > See
  - id: crete-heraklion-palace-of-knossos
    name: Palace of Knossos
    kinds:
      - historic_site
    description: If you see just one ruin on Crete, see Knossos (in Greek it’s Κνωσός, stress is on the second syllable). The site is fairly compact, and much of it is accessible with restricted mobility. But 30 minutes will do it. It is one of six Minoan Palatial Centres to be listed as a world heritage site.
    crowd_level: null
    best_months: []
    source_ref: Heraklion > See
  - id: crete-heraklion-koules
    name: Koules
    kinds:
      - nature
    description: 'Koules (Greek: Κούλες) was built by the Venetians in the 16th C. From the parapet, enjoy the view towards Dia Islet, where Jacques Cousteau found many sunken remains of Cretan sea trade.'
    crowd_level: null
    best_months: []
    source_ref: Heraklion > See
  - id: crete-heraklion-fortifications-of-heraklion
    name: Fortifications of Heraklion
    kinds:
      - historic_site
    description: The Fortifications of Heraklion are among the most impressive Venetian defensive works in the Mediterranean, encircling the old city of Heraklion. Built between the 15th and 17th centuries, their massive walls and bastions helped the city withstand a 21-year Ottoman siege—the longest in history—before falling in 1669. Much of the circuit survives today and can be walked, offering sweeping views and access to key monuments like the harbour fortress.
    crowd_level: null
    best_months: []
    source_ref: Heraklion > See
  - id: crete-heraklion-historical-museum-of-crete
    name: Historical Museum of Crete
    kinds:
      - beach
      - historic_site
      - museum
    description: Covers the story of Crete from the Byzantine era to the present day. It includes material on World War II and the German occupation, which was displayed in the “Museum of the Battle for Crete and National Resistance” until it closed.
    crowd_level: null
    best_months: []
    source_ref: Heraklion > See
  - id: crete-heraklion-loggia
    name: Loggia
    kinds:
      - other
    description: An elegant city meeting place, built in 1628.
    crowd_level: null
