      - adventure
    description: The largest mountain in Crete at 2400 m and a UNESCO Geopark. Be careful when climbing there due to the unstable terrain.
    crowd_level: null
    best_months: []
    source_ref: Rethymno > See
  - id: crete-rethymno-neratze-mosque-and-mikrasiaton-square
    name: Neratze Mosque and Mikrasiaton square
    kinds:
      - religious_site
    description: A preserved Ottoman mosque with its minaret now used as a concert hall. A square called the Mikrasiaton is near the mosque and the 1st Primary (Elementary) School is visible from the square.
    crowd_level: null
    best_months: []
    source_ref: Rethymno > See
  - id: crete-rethymno-preveli
    name: Preveli
    kinds:
      - religious_site
    description: A monastery complex 37 km south of Rethymno consisting of two monasteries; the Κάτω (Kato, "lower") and the Πίσω (Piso, "back"). The main one is a Stavropegiac and Patriarchal Monastery dedicated to Saint John the Theologian (Evangelist). Also known as the "great river" (Μεγάλου Ποταμού) monastery, it is known for the revoluition against the Axis during World War II.
    crowd_level: null
    best_months: []
    source_ref: Rethymno > See
  - id: crete-rethymno-rimondi-fountain
    name: Rimondi Fountain
    kinds:
      - historic_site
      - family
    description: A preserved Venetian fountain built by an aristocratic family. It has three mask-shaped taps/faucets with constant water flowing. The water, through potable, it is not recommended to drink from there, unless you are 100% sure. Ask a local.
    crowd_level: null
    best_months: []
    source_ref: Rethymno > See
