pois:
  - id: santorini-kamari-beach
    name: Kamari Beach
    kinds:
      - beach
    description: Kamari Beach, a black sand beach in Kamari, continues south in Perissa.
    crowd_level: null
    best_months: []
    source_ref: Santorini > Do > Beaches
  - id: santorini-red-beach
    name: Red Beach
    kinds:
      - beach
      - nature
      - historic_site
      - viewpoint
      - boat_trip
      - adventure
    description: Red Beach south of Akrotiri earns its name from the iron-rich sedimentary rocks in the cliff face towering above the water, as well as the red sand. It's quite crowded. Many distant yachts can be seen from the beach—it looks really romantic at sunset time. Great snorkelling - an abundance of sea life is present, as with Perissa.
    crowd_level: null
    best_months: []
    source_ref: Santorini > Do > Beaches
  - id: santorini-white-beach
    name: White Beach
    kinds:
      - hiking
      - beach
      - boat_trip
    description: White Beach can be reached only from the sea; get there by boat from Red Beach or Akrotiri. There is no pier so the only way to get there is by getting off the boat and walking through waist-deep water. It is beautiful, but very small with only a few beach chairs and umbrellas and no facilities.
    crowd_level: null
    best_months: []
    source_ref: Santorini > Do > Beaches
  - id: santorini-vlychada-nude-beach
    name: Vlychada nude beach
    kinds:
      - beach
    description: Vlychada nude beach is popular with naturists.
    crowd_level: null
    best_months: []
    source_ref: Santorini > Do > Beaches
  - id: santorini-perissa-perivolos-agios-georgios-beach
    name: Perissa — Perivolos — Agios Georgios beach
    kinds:
      - beach
      - food
      - nightlife
    description: Perissa — Perivolos — Agios Georgios beach is a continuous beach with varying colours and sand/pebble sizes stretching from Perissa to Agios Georgios with a length of 3 km. It has beach bars and restaurants that makes it feel like a "beach day club".
    crowd_level: null
    best_months: []
    source_ref: Santorini > Do > Beaches
  - id: santorini-baxedes-beach
    name: Baxedes beach
    kinds:
      - beach
    description: Baxedes beach is the main beach at the north side of Thira island. Baxedes is a peaceful place with black sand, much more like how Santorini was like before mass tourism discovered the island.
    crowd_level: null
    best_months: []
    source_ref: Santorini > Do > Beaches
  - id: santorini-oia-greece-amoudi-bay
    name: Amoudi Bay
    kinds:
      - nature
      - viewpoint
      - food
    description: The most picturesque bay on Thira, the moon shaped bay is surrounded by barren cliffs and a lovely promenade with restaurants. Fantastic spot to watch the famous sunset, although it tends to get crowded for that reason in the evenings.
    crowd_level: null
    best_months: []
    source_ref: Oia (Greece) > See
  - id: santorini-oia-greece-londsa-castle
    name: Londsa Castle
    kinds:
      - historic_site
      - viewpoint
    description: Ruins of a Byzantine fortress that are a prominent landmark in the oldest part of town. It offers fantastic sunset views in the evening. The history of the castle dates back to the 15th century, and it survived for almost 600 years. Unfortunately, like many other structures on Santorini, it was largely levelled by the 1956 earthquake. Only the base of a tower and facade remain of what was once an impressive defensive structure built to protect the island from pirate attacks.
    crowd_level: null
    best_months: []
    source_ref: Oia (Greece) > See
  - id: santorini-oia-greece-armeni-bay
    name: Armeni Bay
    kinds:
      - beach
    description: Harder to reach than Amoudi Bay, and therefore far less crowded. Limited facilities, but great for a swim.
    crowd_level: null
    best_months: []
    source_ref: Oia (Greece) > See
  - id: santorini-oia-greece-katharos-beach
    name: Katharos Beach
    kinds:
      - beach
      - food
    description: Quiet pebble stone beach with the adjacent Katharos Lounge which serves great food.
    crowd_level: null
    best_months: []
    source_ref: Oia (Greece) > See
  - id: santorini-oia-greece-agios-georgios-church
    name: Agios Georgios Church
    kinds:
      - religious_site
    description: Christian Orthodox church.
    crowd_level: null
    best_months: []
    source_ref: Oia (Greece) > See
  - id: santorini-oia-greece-naval-museum
    name: Naval Museum
    kinds:
      - historic_site
      - museum
    description: Archaeology museum in a converted traditional house in the centre of town. Its collection features figureheads, seamen's chests, historic maritime equipment, drawings and maps, and models of old and new Thirean ships. There is special attention to the history of the Hellenic Navy.
    crowd_level: null
    best_months: []
    source_ref: Oia (Greece) > See
  - id: santorini-oia-greece-panagia-platsani
    name: Panagia Platsani
    kinds:
      - religious_site
    description: Greek Orthodox church.
    crowd_level: null
    best_months: []
    source_ref: Oia (Greece) > See
  - id: santorini-oia-greece-saint-georgios-oia-holy-orthodox-church
    name: Saint Georgios Oia Holy Orthodox Church
    kinds:
      - religious_site
    description: Greek Orthodox church.
    crowd_level: null
    best_months: []
    source_ref: Oia (Greece) > See
  - id: santorini-oia-greece-fira-oia-hike
    name: Fira - Oia Hike
    kinds:
      - hiking
      - nature
      - adventure
    description: By far the most spectacular hike on Thira is the 11 km trail along the crater rim to Fira. It offers some breathtaking views over the caldera, and the other islands of the archipelago. At a moderate walking pace, the hike takes about 3 hours. The trail starts at Amoudi Bay and follows the rim east through town. It is well-marked; you'll see a few "To Fira" signs as you leave town. Going from Fira to Oia is more uphill, with a climb of over 300 m, so this direction is considered a bit easier.
    crowd_level: null
    best_months: []
    source_ref: Oia (Greece) > Do
  - id: santorini-oia-greece-caldera-massages-studio
    name: Caldera Massages Studio
    kinds:
      - nature
      - viewpoint
    description: Professional massages in the unique cave style treatment rooms. The special Sunset packages include massages in the cave and then viewing from the Terrace to the Oia sunset with a bottle of bubbles. All booking is online.
    crowd_level: null
    best_months: []
    source_ref: Oia (Greece) > Do > Spa and massage
  - id: santorini-oia-greece-perfume-bar
    name: Perfume Bar
    kinds:
      - other
    description: Spa and beauty parlour linked to a bar.
    crowd_level: null
    best_months: []
    source_ref: Oia (Greece) > Do > Spa and massage
  - id: santorini-fira-museum-of-prehistoric-thira
    name: Museum of Prehistoric Thira
    kinds:
      - museum
    description: The story of Akrotiri and other Neolithic and Bronze Age settlements is vividly told through a collection of colorful and artistically-detailed artefacts. Don't miss the collection of vibrant wall murals recovered from Akrotiri.
    crowd_level: null
    best_months: []
    source_ref: Fira > See > Museums
  - id: santorini-fira-folklore-museum
    name: Folklore Museum
    kinds:
      - beach
      - nature
      - museum
      - wine
    description: Museum about the evolution of lifestyle and living on the Santorini archipelago, with displays featuring artisan crafting, a cobbler, blacksmith, distillery, winery, and even a mine underground. All lifestyles from cave houses to modern day typical white dwellings are covered. A guided tour is a necessity to get the most out of a visit, which takes about 45 minutes.
    crowd_level: null
    best_months: []
    source_ref: Fira > See > Museums
  - id: santorini-fira-archaeological-museum-of-thera
    name: Archaeological Museum of Thera
    kinds:
      - historic_site
      - museum
    description: It houses artefacts from Proto-Cycladic culture of the 3rd millennium BC, and continues on to the Classical period.
    crowd_level: null
    best_months: []
    source_ref: Fira > See > Museums
  - id: santorini-fira-megaro-gyzi-museum
    name: Megaro Gyzi Museum
    kinds:
      - museum
    description: An ethnographic museum with a collection of maps, landscapes, engravings, and dresses of the Cycladic Islands from the 15th to the 19th century. It is housed in the Megaro Gyzi mansion dated to the 17th century. It also features an exhibition of old manuscripts from the 16th to the 19th century, as well as painting and photographs of Santorini.
    crowd_level: null
    best_months: []
    source_ref: Fira > See > Museums
  - id: santorini-fira-roger-tourte-exposition
    name: Roger Tourte Exposition
    kinds:
      - museum
    description: Exhibition of work by French artist J.R. Tourte, who moved to Greece before the outbreak of the Second World War and toured the Cyclades until his death in 1972. His work consists of watercoloured scenes of all the major Cycladic Islands along with maps drawn by the artist. Most of the scenes show the authentic islands before they became tourist attractions. The exposition area is in tunnels underground, and are pleasantly cool during hot summer days.
    crowd_level: null
    best_months: []
    source_ref: Fira > See > Museums
  - id: santorini-fira-catholic-church-of-the-dormition-the-three-bells-of-fira
    name: Catholic Church of the Dormition (The Three Bells of Fira)
    kinds:
      - hiking
      - nature
      - religious_site
    description: This church famed for its iconic three bells, blue dome, and picturesque views which make it one of the most photographed places on the island. The history dates back to the mid-17th century when two cave churches were built into the-then solid cliff face, but these were destroyed as the cliff receded. An infirmary was built in its place which attracted Jesuits who lived on the site until the land was given to the Diocese of Santorini. The current church was built in 1757 and underwent many expansions and refurbishments, for example in 1958 when it was damaged by an earthquake. Hikers following the Fira to Oia coastal path will pass the Three Bells along their way.
    crowd_level: null
    best_months: []
    source_ref: Fira > See > Religious architecture
  - id: santorini-fira-dominican-convent
    name: Dominican Convent
    kinds:
      - religious_site
    description: Founded in 1595, it is the oldest Catholic nunnery in Greece, but the current building dates from 1864. The church was consecrated in 1825 as the Church of the Virgin of the Rosary, but was severely damaged during the 1956 earthquake and subsequently repaired. The sanctuary behind the altar in the church is the icon of Our Lady of the Rosary with St. Dominic and St. Catherine flanked by statues of St. Joseph.
    crowd_level: null
    best_months: []
    source_ref: Fira > See > Religious architecture
  - id: santorini-fira-orthodox-metropolitan-cathedral
    name: Orthodox Metropolitan Cathedral
    kinds:
      - religious_site
    description: Cathedral built in 1827, traditionally styled with an outside courtyard space and nicely decorated interior. It was heavily damaged by the 1956 earthquake but subsequently restored to its former glory.
    crowd_level: null
    best_months: []
    source_ref: Fira > See > Religious architecture
  - id: santorini-fira-cathedral-of-saint-john-the-baptist
    name: Cathedral of Saint John the Baptist
    kinds:
      - historic_site
      - religious_site
    description: Parish of the Roman Catholic Church in Fira, serving as the cathedral of the Roman Catholic Diocese of Santorini founded in 1204. The baroque church building in blue-gray and cream colours was built in 1823 and restored in 1970 after the earthquake of 1956.
    crowd_level: null
    best_months: []
    source_ref: Fira > See > Religious architecture
  - id: santorini-fira-the-white-door-theatro
    name: The White Door Theatro
    kinds:
      - other
    description: Theatre famous for its play The Greek Wedding, a comedy set in 1940s Greece.
    crowd_level: null
    best_months: []
    source_ref: Fira > Do
  - id: santorini-fira-santorini-zen-spa
    name: Santorini Zen Spa
    kinds:
      - other
    description: Massage and relaxation.
    crowd_level: null
    best_months: []
    source_ref: Fira > Do
  - id: santorini-fira-kokkalo
    name: Kokkalo
    kinds:
      - food
    description: Restaurant offering cooking courses to teach yourself how to cook Greek cuisine the traditional way.
    crowd_level: null
    best_months: []
    source_ref: Fira > Do
  - id: santorini-fira-watch-a-sunset
    name: Watch a sunset
    kinds:
      - viewpoint
    description: Watch a sunset from the caldera rim, ideally while enjoying dinner or a drink.
    crowd_level: null
    best_months: []
    source_ref: Fira > Do
  - id: santorini-fira-go-to-the-old-port
    name: Go to the Old Port
    kinds:
      - other
    description: Go to the Old Port if you didn't come in that way; see above. There is almost nothing to do at the Old Port except to take a boat or take a couple of pictures, but the ride down and up can be fun.
    crowd_level: null
    best_months: []
    source_ref: Fira > Do
  - id: santorini-fira-agiou-mina-street
    name: Agiou Mina Street
    kinds:
      - hiking
      - nature
    description: This street goes along the crater rim through Fira, from the south part of town to the cable car. It provides the stunning views of Fira that you came to see. You can walk either north or south, but walking north has the advantage that the main part of Fira is in front of you. Just be careful of the donkey poop!
    crowd_level: null
    best_months: []
    source_ref: Fira > Do > Walks and hikes
  - id: santorini-fira-fira-oia-hike
    name: Fira - Oia Hike
    kinds:
      - hiking
      - nature
      - adventure
    description: By far the most spectacular hike on Thira is the 11 km trail along the crater rim to Oia. It offers some breathtaking views over the caldera, and the other islands of the archipelago. At a moderate walking pace, the hike takes about 3 hours. The trail starts northward from Agiou Mina Street and is well-marked; you'll see a few "To Oia" signs before leaving town. Going from Fira to Oia is more uphill, with a climb of over 300 m, so the reverse direction is considered a bit easier.
    crowd_level: null
    best_months: []
    source_ref: Fira > Do > Walks and hikes
  - id: santorini-fira-nea-kameni
    name: Nea Kameni
    kinds:
      - hiking
      - nature
      - historic_site
      - boat_trip
    description: The barren "New Burnt Island", only 2 km in diameter, is the summit of the current volcano in the centre of the caldera. The island is the result of volcanic eruptions during historic times; the oldest rock still at the surface is from about 1570. The volcano is dormant today, but eruptions have occurred as recently as 1950, when the newest lava dome was extruded. Volcanologists from the Institute for the Study and Monitoring of the Santorini Volcano continuously monitor the activity levels. It is only a 10 minute boat journey from Fira Old Port; there are daily boat tours from numerous tour agencies. A 1 km hiking trail over uneven gravel leads to active sulpher vents and the 130 m summit. There are no supplies, shade, or toilets on the island so come well prepared; bring loads of water! Proper hiking shoes are a necessity.
    crowd_level: null
    best_months: []
    source_ref: Fira > Do > Boat trips
  - id: santorini-fira-palea-kameni
    name: Palea Kameni
    kinds:
      - beach
      - nature
      - religious_site
      - boat_trip
    description: The youngest island of the archipelago, "Old Burnt Island" has a single inhabitant, Sostice Arvanitis, who is a goat herder and keeper on the island. The points of interest on this small barren island are a church and a hot spring tucked in a small bay that is a common swimming hole for caldera boat cruises.
    crowd_level: null
    best_months: []
    source_ref: Fira > Do > Boat trips
  - id: santorini-perissa-agia-irini
    name: Agia Irini
    kinds:
      - historic_site
      - religious_site
    description: Ruins of an early Christian basilica.
    crowd_level: null
    best_months: []
    source_ref: Perissa > See
  - id: santorini-perissa-timiou-stafrou
    name: Timiou Stafrou
    kinds:
      - historic_site
      - religious_site
    description: A Greek Orthodox church with characteristic blue roofed domes. This church is one of the largest on Thira. The first church was built between 1835-1840, but was destroyed by the earthquake of 1956 like most historic architecture on the island, and has since been restored.
    crowd_level: null
    best_months: []
    source_ref: Perissa > See
  - id: santorini-perissa-panagia-katefiani
    name: Panagia Katefiani
    kinds:
      - nature
      - religious_site
    description: Chapel built into the hillside above Perissa between 1537 and 1650 at an altitude of 200 m. This enabled the chapel to repel attacks of pirates and invaders, which allowed it to survive to the present day. There is a cave with a fountain behind the presbytery, which according to local legends has healing properties.
    crowd_level: null
    best_months: []
    source_ref: Perissa > See
  - id: santorini-perissa-museum-of-minerals-and-fossils
    name: Museum of Minerals and Fossils
    kinds:
      - museum
    description: The museum has a collection of minerals and fossils from Santorini and other parts of Greece. The specimens in the collection date back 1.5 billion to 50,000 years. The most interesting exhibits in this facility are a 2 m long fossilised olive tree branch, plant fossils from the Santorini caldera dated 50,000 years old, and a range of geological specimens of scientific interest.
    crowd_level: null
    best_months: []
    source_ref: Perissa > See
  - id: santorini-perissa-ancient-quarry
    name: Ancient Quarry
    kinds:
      - historic_site
    description: Overgrown remains of a quarry that was used in antiquity to quarry the stones needed for the construction of Ancient Thera.
    crowd_level: null
    best_months: []
    source_ref: Perissa > See
  - id: santorini-perissa-perissa-beach
    name: Perissa Beach
    kinds:
      - beach
    description: Black sand and pebble beach, similar to Kamari but slightly less busy in winter. It's still very touristy though so expect a jungle of parasols and desk chairs during summer months.
    crowd_level: null
    best_months: []
    source_ref: Perissa > Do
  - id: santorini-perissa-mediterranean-dive-club
    name: Mediterranean Dive Club
    kinds:
      - beach
    description: Their dive station is on Caldera Beach near Akrotiri, but they also have an office on Perissa Beach.
    crowd_level: null
    best_months: []
    source_ref: Perissa > Do
  - id: santorini-megalochori-lost-atlantis-experience
    name: Lost Atlantis Experience
    kinds:
      - nature
      - historic_site
      - museum
    description: Interactive museum featuring a 9D experience with a focus on Greek history, mythology, philosophy, and geology. It aims to link the Minoan history of Santorini to the myth of Atlantis through the volcanic eruption, using a series of interactive videos, dioramas, holographic projections, and augmented reality. Visitors are introduced to famous philosopher Plato and his views on history. All exhibits are in Greek as well as English.
    crowd_level: null
    best_months: []
    source_ref: Megalochori > See
  - id: santorini-megalochori-the-heart-of-santorini
    name: The Heart of Santorini
    kinds:
      - viewpoint
    description: A path leads to a heart-shaped hole in the caldera, popular for sunset sea views.
    crowd_level: null
    best_months: []
    source_ref: Megalochori > See
  - id: santorini-megalochori-plaka-thermal-springs
    name: Plaka Thermal Springs
    kinds:
      - beach
