pois:
  - id: seiser-alm-the-witches-benches
    name: The Witches' benches
    kinds:
      - hiking
      - nature
    description: The witches' benches are to be found in the summit of the Puflatsch (2176 m) and look like armchair-shaped, rock steps; From this unique rock formation one gets a beautiful view over Kastelruth and the Val Gardena valley. According to the legend (seen posted on a wooden board near the Puflatsch mountain farmhouse), the witches sit on the witches' benches as they enjoy the beautiful view. At night the Schlern witches, according to the same legend, gather together at the witches' benches, before they fly over the Seiser Alm with joyous cries, celebrating wildly.
    crowd_level: null
    best_months: []
    source_ref: See
  - id: seiser-alm-franciscan-church
    name: Franciscan Church
    kinds:
      - religious_site
    description: 'The Church of St. Francis (Italian: Chiesa di San Francesco, Ladin: Dlieja de San Francesch) was built in Compatsch in 2008 and consecrated to St. Francis (Francis of Assisi) on 20 September 2009. Already in the 1960s there had been plans to build a church on the Alpe di Siusi. The architect Walter Walter chose the dove as the basis for the design of the Franciscan church, since, in addition to the symbol for the Holy Spirit, it is the biblical original motif for peace and security, understanding and encounter. Thus, the outline of the church is shaped like a dove.'
    crowd_level: null
    best_months: []
    source_ref: See
  - id: seiser-alm-church-of-st-leonard
    name: Church of St. Leonard
    kinds:
      - historic_site
      - religious_site
      - village
    description: Pfarrkirche St. Leonhard is a small listed church in Pufels, a small hamlet north of the Alpe di Siusi, which belongs administratively to Kastelruth. The first chapel of the cattle patron St. Leonhard in Pufels was built in Romanesque style no later than the 13th century. Towards the end of the fifteenth century it was gothicized and enlarged; The first mention of this church in historical records was in 1339. The Romanesque tower is still preserved, while it was expanded in 1555 and extended and baroque in 1740. In 1855 the church ship was expanded, in 1895 the tower helmet was built. Also worth seeing in Pufels is the Rosarium Uhrerhof
    crowd_level: null
    best_months: []
    source_ref: See
  - id: seiser-alm-church-of-the-holy-cross
    name: Church of the Holy Cross
    kinds:
      - religious_site
      - village
    description: This is a visually striking parish church found in the nearby village of Seis am Schlern, which is to the south of Kastelruth, in the foothills of the Schlern.
    crowd_level: null
    best_months: []
    source_ref: See
  - id: seiser-alm-gardena-pass
    name: Gardena pass
    kinds:
      - hiking
      - nature
    description: A mountain pass from which some hikes can also be done towards the Sella Joch.
    crowd_level: null
    best_months: []
    source_ref: See
  - id: seiser-alm-hans-paula-steger-trail
    name: Hans & Paula Steger trail
    kinds:
      - hiking
      - beach
      - adventure
    description: The Hans & Paula Steger trail (trail number 30) between Compatsch and Saltria is a 4.65-km-long natural and cultural trail that is also suitable for prams. Information boards at the edge of the road describe the area and tell about the legend of the Partschott. The hike can be shortened or lengthened as desired by several bus stops at the edge of the road and further hiking trails. If there is sufficient snow cover, the trail is used in winter as a winter hiking trail; cross-country ski runs can be safely made over bridges.
    crowd_level: null
    best_months: []
    source_ref: Do > In the summer > Hiking
  - id: seiser-alm-puflatsch-circular-trail
    name: Puflatsch circular trail
    kinds:
      - hiking
    description: The trail, also known as the Puflatschrund, has a length of about 10 km and is marked as No. 14, No. 24 and PU. It runs from Compatsch over the Arnikahütte to the Gollerkreuz. From this one walks with beautiful view past the legendary Witches' benches and the summit of the Puflatsches and on to the Filinerkreuz. After this the trail loops back southwards over the Puflatschalpe to Compatsch.
    crowd_level: null
    best_months: []
    source_ref: Do > In the summer > Hiking
  - id: seiser-alm-friedrich-august-trail
    name: Friedrich-August trail
    kinds:
      - hiking
    description: This trail, marked as No. 7A, 9 and 557, connects to the Sella Joch on about 10.5 km of Saltria. On the way you will pass the Zallinger Hütte (2037 m), the (2300 m), the Rifugio Sandro Pertini (2300 m), the Rifugio Friedrich August (2298 m) and the Rifugio Salei (2222 m). The ascent from Saltria can be shortened with the Florianlift. There is a bus stop at the Sella Joch, from where you can go down to Val Gardena.
    crowd_level: null
    best_months: []
    source_ref: Do > In the summer > Hiking
  - id: seiser-alm-witches-benches-adventure-trail
    name: Witches' benches adventure trail
    kinds:
      - hiking
      - historic_site
      - adventure
    description: The trail has a circular route over a very invigorating 2 km. It begins at the Tirler Alm/Hotel Tirler and is marked by works of art on the witch Curandina and the wise owl Emma. Intermediate routes and stations of the sense trail are among other things the natural monument sulfur springs in the "Hexenwald" and the Hexenblick Puflatsch.
    crowd_level: null
    best_months: []
    source_ref: Do > In the summer > Hiking
  - id: seiser-alm-langkofelhutte-seirlseralm-pasture
    name: Langkofelhutte/Seirlseralm pasture
    kinds:
      - hiking
    description: 5h, Red-class hike, Seilbach-haus
    crowd_level: null
    best_months: []
    source_ref: Do > In the summer > Hiking
  - id: seiser-alm-oskar-schuster-climbing-trail
    name: Oskar-Schuster climbing trail
    kinds:
      - hiking
      - adventure
    description: 'The trail leads from the Langkofelhütte (Italian: Rifugio Vicenza, Ladin: Utia de Dantersasc) (2253 m) up to the Plattkofel (2860 m). As medium-difficulty climb (2nd difficulty level (UIAA)), it has only a few secured sections, and is not recommended for beginners! Because of the great danger of rocking next to the usual climbing equipment, wear a protective helmet. The descent from the Plattkofel takes place via the much-traveled and easy-to-reach hiking trail no. 527, from which you can cross the Friedrich-August-Weg back to the Sella Joch.'
    crowd_level: null
    best_months: []
    source_ref: Do > In the summer > Climbing
  - id: seiser-alm-maximilian-climbing-trail
    name: Maximilian Climbing Trail
    kinds:
      - hiking
      - adventure
    description: 'This runs from the Tierser-Alpl-Hütte (Italian: Rifugio Alpe di Tires) (2444 m) over the entire Rosszahnkamm. Through short secured sections is the climbing route in the second difficulty level (UIAA). In the Roterdscharte (2435 m) there is an emergency descent to the south. The descent begins west of the Roterdspitze (2655 m) and leads back to the. This can be reached from Compatsch either via the Rosszahnscharte (2499 m) or the Dialer-Seiser Alm Hütte (2145).'
    crowd_level: null
    best_months: []
    source_ref: Do > In the summer > Climbing
  - id: seiser-alm-seiser-alm-half-marathon
    name: Seiser Alm Half-Marathon
    kinds:
      - other
    description: This half-marathon started in 2013 and is held every year. The 21-km stretch has 601 m of elevation gain. The number of participants is limited to 500 runners. The Seiser Alm Running Expo is part of the half marathon. The Seiser Alm is a traditional training area for the Kenyan marathon runners during the first months of the summer, which helps prepare themselves for the autumn marathons under the special altitude conditions of the Seiser Alm.
    crowd_level: null
    best_months: []
    source_ref: Do > In the summer > Running
