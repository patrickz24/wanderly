  - id: andalusia-ronda-museo-de-peinado
    name: Museo de Peinado
    kinds:
      - historic_site
      - museum
    description: Joaquin Peinade was born in 1898 in Ronda and died in 1975 in Paris. Artistically he was a descendant of Cézanne and spiritual son of Picasso, and he is often described as the most elegant of the painters from the so-called 'Spanish School' of Paris. Paintings from the painter's career, which spanned from 1923-1974 are on display. The collection includes more than 190 pieces, including some lesser-known works from the painter's private collection. Particularly noteworthy paintings include Still Life with Pears, Figure with Dove, Fruit Basket, and Female Nude. The museum is housed in a palace named after the last Aztec king, in the center of La Ciudad. The building from the 19th century has mixed architectural influences, and both courtyards are worth looking at.
    crowd_level: null
    best_months: []
    source_ref: Ronda > See > La Ciudad
  - id: andalusia-ronda-museo-lara
    name: Museo Lara
    kinds:
      - museum
    description: Opened following the initiative of Juan Lara Jurado, this museum houses a collection of more than 2000 works of art and antiquities. It is the largest private museum in Andalusia.
    crowd_level: null
