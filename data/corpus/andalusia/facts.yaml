  - id: andalusia-ronda-puente-nuevo
    name: Puente Nuevo
    kinds:
      - nature
      - museum
    description: This large and incredible bridge over the Tajo gorge, finished in 1793, is Ronda's principal attraction. The bridge is 70 m long and 98 m high, equivalent to a 30-floor building, and connects the quarter of La Ciudad with the Mercadillo. It was built following the collapse of an earlier bridge from 1735; this bridge had a single arch of 35m but collapsed six years after construction, killing 50 people. There are beautiful views from here of the Sierra de Grazalema to the west. A small museum is inside.
    crowd_level: null
    best_months: []
    source_ref: Ronda > See
  - id: andalusia-ronda-plaza-de-toros
    name: Plaza de Toros
    kinds:
      - other
    description: The oldest and one of the most highly regarded of Spain's bull rings, built in 1785 in the neoclassical style. This is considered to be the cradle of modern Spanish bullfighting, where Pedro Romero (1754-1839) developed a new style of fighting bulls on foot (and not from horseback as had been done previously); he also was the first to begin using a red cloth. Romero retired after he had killed 5000 bulls and remained uninjured. His son and grandson carried on the tradition.
    crowd_level: null
