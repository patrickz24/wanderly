  - id: andalusia-granada-elviras-gate
    name: Elvira's Gate
    kinds:
      - other
    description: Once the principal gate to the old city, Elvira's Gate now stands on the edge of a plaza, a grand Moorish-style archway over a local street.
    crowd_level: null
    best_months: []
    source_ref: Granada > See > North Granada
  - id: andalusia-granada-hospital-real
    name: Hospital Real
    kinds:
      - nature
    description: Commissioned in 1504 by Isabel and Ferdinand, this massive square red-brick building was originally used as a hospital for the poor and soldiers who had been injured in the Reconquista of Granada. Situated on a hill over a nearby park, the structure now belongs to the University and is worth looking inside for its splendid architecture.
    crowd_level: null
    best_months: []
    source_ref: Granada > See > North Granada
  - id: andalusia-granada-triunfo-gardens
    name: Triunfo Gardens
    kinds:
      - nature
      - historic_site
    description: A beautiful urban park situated beneath the Hospital Real, the gardens hold a large fountain and an isolated column with a monument to the Virgin at the center overlooking the Avenida de La Constitucion. Evening is the best time to come, when the fountains are lit and the backdrop with the illuminated Hospital Real is most dramatic.
    crowd_level: null
    best_months: []
    source_ref: Granada > See > North Granada
  - id: andalusia-granada-cartuja-monastery
    name: Cartuja Monastery
    kinds:
      - nature
      - religious_site
    description: A spectacular example of Baroque-style architecture, this monastery was commissioned in the 16th century but construction was interrupted and not completed until over three centuries later. Upon entering you'll pass through a cloister garden that serves as the building's tranquil courtyard, with small rooms splitting off from here, many with grisly paintings of martyrs meeting their fates. The single-nave church is spectacular and lavishly decorated, with the sanctuary and sacristy containing many beautifully crafted and intricate artworks.
    crowd_level: null
    best_months: []
    source_ref: Granada > See > North Granada
  - id: andalusia-granada-san-jeronimo-monastery
    name: San Jeronimo Monastery
    kinds:
      - religious_site
    description: The first monastery to be built in the city after the reconquest by the Christians, this monastery is noted for its picturesque courtyards, the Spanish Baroque-style sacristy and the splendid artwork on display.
    crowd_level: null
    best_months: []
    source_ref: Granada > See > North Granada
  - id: andalusia-granada-basilica-san-juan-de-dios
    name: Basilica San Juan de Dios
    kinds:
      - nature
      - religious_site
      - adventure
    description: "A gorgeous example of the Baroque granadino style with an over-the-top interior—not an inch isn't lavishly decorated. The basilica is also the final resting place of many of Granada's saints: ask permission to climb the stairs to the room behind the main altar where 190 bones and other relics are displayed."
    crowd_level: null
    best_months: []
    source_ref: Granada > See > North Granada
  - id: andalusia-granada-santo-domingo-church
    name: Santo Domingo Church
    kinds:
      - historic_site
      - religious_site
    description: Founded in 1512 by the Catholic Kings, this beautiful church sports a handsome stone portico entrance with a lovely painting and sculptures beneath an impressive bell tower. Inside, the high ceilings and domed sanctuary are spectacular and the chapels feature intricate artwork.
    crowd_level: null
    best_months: []
    source_ref: Granada > See > South Granada
  - id: andalusia-granada-carmen-de-los-martires
    name: Carmen de los Mártires
    kinds:
      - nature
    description: An absolutely beautiful set of gardens near the Alhambra, this place is well worth a side trip if you have an hour or two to spare. The gardens date to the nineteenth century and have a blend of Moorish-style elements such as amble shade, decorative arches and bubbling fountains with English and French romantic style elements - one garden has an ornamental duck pond complete with statues, grottoes and follies (keep an eye out for the peacocks that wander the gardens). In addition, the views of Granada and the Alhambra from the terraces are absolutely marvelous.
    crowd_level: null
    best_months: []
    source_ref: Granada > See > South Granada
  - id: andalusia-granada-federico-garcia-lorca-museum
    name: Federico García Lorca Museum
    kinds:
      - nature
      - museum
      - family
    description: On the outskirts of town is this charming house that was once the summer home of poet Federico Garcia Lorca. The house-turned-museum holds the original furnishings from when he lived here in the 1920s and 30s and is pleasant enough, but the real attraction here is the splendid public park that surrounds the house that was once the family's private estate. Within the park you'll find tree-lined pathways, streams of water, a duck pond, a large rose garden, and a children's playground.
    crowd_level: null
    best_months: []
    source_ref: Granada > See > South Granada
  - id: andalusia-granada-basilica-nuestra-senora-de-las-angustias
    name: Basilica Nuestra Señora de Las Angustias
    kinds:
      - historic_site
      - religious_site
    description: The temple to Granada's patron saint, this seventeenth century church has a richly decorated interior and is a center for local Catholic processions. The evening mass held here is one of the most heavily attended in the city and is one of the best opportunities to experience the city's religious heritage firsthand.
    crowd_level: null
    best_months: []
    source_ref: Granada > See > South Granada
  - id: andalusia-granada-rio-genil
    name: Rio Genil
    kinds:
      - hiking
      - nature
    description: While the river itself, which is essentially a large canal, isn't much to look at, there is a nice tree-lined promenade running alongside the river from Acera Del Darro along Paseo del Salon with some very pleasant gardens. From here a pleasant trail follows the river south out of the city into the Sierra Nevada mountains.
