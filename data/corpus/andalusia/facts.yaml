  - id: andalusia-lake-negratin
    name: Lake Negratin
    kinds:
      - beach
      - nature
      - food
    description: Lake Negratin is situated at the foothills of Mount Jabalcón. As one of Europe's largest lakes, it really is worth seeing not least for the most magnificent lunar-landscape that surrounds it. The rock formations and the colours it produces during different times of the day can be likened to those of the Grand Canyon. There is a man-made beach where you can laze the day away, a number of restaurants dotted round the lake and on a nice day you can swim or take out a pedalo boat, which might lead you to pink flamingos and various other wildlife.
    crowd_level: null
    best_months: []
    source_ref: Andalusia > See
  - id: andalusia-seron
    name: Seron
    kinds:
      - historic_site
    description: Seron is nestled on the lower slopes of the Sierra de los Filabres and is a picturesque town that cascades down the hillside. Dominated by its Castle, which sits at the very top, Seron is famous for its ham and provides a more traditional experience of Andalusian life. It is a beautiful location to start your exploration of the Filabres, or visit at the right time of year and you might find yourself submerged in a vibrant fiesta.
    crowd_level: null
    best_months: []
    source_ref: Andalusia > See
  - id: andalusia-las-menas
    name: Las Menas
    kinds:
      - historic_site
      - village
    description: Las Menas, an old mining village abandoned thirty years ago, makes an interesting stop in the Sierra de los Filabres. You can investigate old ruins crumbling amidst the most breathtaking countryside, stop for coffee and cake at the hotel and even camp for the night.
    crowd_level: null
    best_months: []
    source_ref: Andalusia > See
  - id: andalusia-andaventur-granada-adventure-company
    name: Andaventur Granada Adventure Company
    kinds:
      - hiking
      - nature
      - adventure
    description: Outdoor sports in the Sierra Nevada National park and Granada province, Tandem paraglider flights, Canyoning, Hiking, Ski, Rock Climbing, Horse riding.
    crowd_level: null
    best_months: []
    source_ref: Andalusia > Do
  - id: andalusia-rock-climbing-company
    name: Rock Climbing Company
    kinds:
      - nature
      - adventure
    description: High quality rock climbing and scrambling courses in Andalusia. Courses based in Malaga province both on the coast and also inland near to the El Chorro gorge.
    crowd_level: null
    best_months: []
    source_ref: Andalusia > Do
  - id: andalusia-horse-riding-and-spain
    name: Horse riding and Spain
    kinds:
      - hiking
      - nature
      - food
    description: Horse riding and Spain go hand-in-hand and with such spectacular mountain ranges at your disposal as the Sierra Nevada and Alpujarra Hills; you have a feast of beautiful Andalusian trekking land to indulge in astride your faithful friend. There are several stables situated in these areas, and all offer the option to ride for an hour, a day, or even as long as 7 nights. Accommodation and food are included in prices and the whole experience offers a unique way to see this amazing part of Spain. Prices vary from €25 to €1200 and there are so many options to choose from that you will undoubtedly find something to suit your level and requirements.
    crowd_level: null
    best_months: []
    source_ref: Andalusia > Do
  - id: andalusia-andalusia-day
    name: Andalusia day
    kinds:
      - other
    description: Commemorates the February 28, 1980 referendum on the Statute of Autonomy of Andalusia, in which Andalusians achieved recognition for an autonomous region within the state of Spain.
    crowd_level: null
    best_months: []
    source_ref: Andalusia > Do > Events
  - id: andalusia-seville-cathedral
    name: Cathedral
    kinds:
      - historic_site
      - religious_site
    description: "Huge 15th-century church on the site of the former great mosque; richly decorated with the central nave rising to 37 m. An ornate canopy and statue marks the final resting place of Christopher Columbus. If there's a queue for tickets then go to the nearby Church of Salvador (Iglesia del Salvador) and buy a combi ticket. Cathedral admission includes La Giralda, the minaret that is now the magnificent bell tower. Within, you ascend 34 ramps - no need to keep count as they're tallied on the wall - then a last short flight of steps brings you onto the viewing terrace. Church of Salvador: all of its Rocco altarpieces were cleaned and excavations revealed remains from an Islamic mosque and earlier Christian churches, now accessible in the crypt. Unless you like massive cathedrals, the effect is much more impressive."
    crowd_level: null
    best_months: []
    source_ref: Seville > See > Landmarks
  - id: andalusia-seville-real-alcazar
    name: Real Alcázar
    kinds:
      - nature
      - historic_site
      - religious_site
      - family
    description: 'A beautiful palace in Mudéjar (Moorish) style, built in the 12th century by the Almohad Caliphs. Greatly remodelled and extended in the 14th century by Pedro I the Cruel, its myriad rooms, extravagant architecture, lavish gardens including a maze, with many courtyards, ponds and secrets to be explored, make it a fascinating place to visit. The room where Christopher Columbus''s journey across the Atlantic was planned has his coat of arms embroidered on the wall along with those of royalty. The Royal Apartments are open to tours whenever the royal family aren''t using them. In the heat of summer the palace is a cool retreat from the sun''s glare, and there are night tours Mar-Oct. There are toilets and a cafe within the walls of the site. It gets busy in high season: buy tickets online in advance, and only from the official website. The tourist entrance, "The Lion''s Gate", is on the side facing the cathedral and has a large image of a lion above it.'
    crowd_level: null
    best_months: []
    source_ref: Seville > See > Landmarks
  - id: andalusia-seville-hospital-de-los-venerables
    name: Hospital de los Venerables
    kinds:
      - religious_site
    description: A 17th-century retirement home and hospital for aged and sickly retired priests, restored by the Fundación to preserve an example of Andalusian architecture at its very best. Includes a resplendent Baroque chapel which is highly recommended, as well as the Santa Rufina painted by Diego Velázquez.
    crowd_level: null
    best_months: []
    source_ref: Seville > See > Landmarks
  - id: andalusia-seville-torre-del-oro
    name: Torre del Oro
    kinds:
      - beach
      - historic_site
      - museum
    description: A 13th-century tower, the top of which is rumored to have once been covered in gold. It now houses the local maritime museum.
    crowd_level: null
    best_months: []
    source_ref: Seville > See > Landmarks
  - id: andalusia-seville-alameda-de-hercules
    name: Alameda de Hercules
    kinds:
      - food
    description: Authentic and less touristy plaza with local food opportunities.
    crowd_level: null
    best_months: []
    source_ref: Seville > See > Landmarks
  - id: andalusia-seville-parque-maria-luisa
    name: Parque María Luisa
    kinds:
      - historic_site
      - museum
    description: Built for the 1929 Iber-Americano World's Fair and now landscaped with attractive monuments and museums.
    crowd_level: null
    best_months: []
    source_ref: Seville > See > Landmarks
  - id: andalusia-seville-palacio-de-las-duenas
    name: Palacio de Las Dueñas
    kinds:
      - historic_site
      - religious_site
    description: Las Dueñas is a palace belonging to the House of Alba. It was built in the 15th century, with Renaissance architecture style and Gothic-Mudejar influences. The palace is one of the major historic homes in the city. The poet Antonio Machado was born here in 1875. It is also said that Amerigo Vespucci married in this chapel at the beginning of the 16th century. The Palace has a great collection of paintings (Ribera, Luca Giordano, Neri de Bicci), ceramics, antique furniture and other decorative arts, sculptures of Ancient Rome and contemporary (Mariano Benlluire), Flemish tapestries (Willem de Pannemaker), mosaics, and many other pieces of art. An important site for understanding Andalusian customs and history.
    crowd_level: null
    best_months: []
    source_ref: Seville > See > Landmarks
  - id: andalusia-seville-plaza-de-espana
    name: Plaza de España
    kinds:
      - museum
    description: 'The site of the Spanish pavilion from the 1929 exhibition: the semi-circle has little ceramic maps of every region of Spain plus images of them and/or their history. It was also used in the filming of the Star Wars prequels. Visit it early in the morning on a weekday to see a long line of immigrants outside one of the government offices it now houses, or visit it right before it closes (officially at 22:00 but likely half an hour later) to see it completely empty and rather eerie.'
    crowd_level: null
    best_months: []
    source_ref: Seville > See > Landmarks
  - id: andalusia-seville-real-fabrica-de-tabacos
    name: Real Fábrica de Tabacos
    kinds:
      - nature
      - historic_site
      - religious_site
    description: "The main building of the University of Seville was once the Tobacco Factory of Seville, and was constructed between 1728 and 1771 by Sebastián Van der Bocht. Over the main entrance, the triangular façade ends in a statue of La Fama (fame). The tobacco factory was then the largest industrial building in Spain. A monopoly assured high income, which is reflected in the factory's architecture and surrounding gardens. Its chapel and prison complement the main building. In the interior you find impressive stairways, fountains and Patios. It was the setting for the first act of Bizet's opera Carmen. In 1953 the factory was converted into the main building of Seville University. Just behind the tobacco factory, the María Luisa Park borders the historic centre of Seville to the south. Although it's open to the public (as all university buildings are), the building is used for academic purposes. Be respectful: don't venture into closed rooms and disrupt lectures."
    crowd_level: null
    best_months: []
    source_ref: Seville > See > Landmarks
  - id: andalusia-seville-palacio-de-la-condesa-de-lebrija
    name: Palacio de la Condesa de Lebrija
    kinds:
      - historic_site
    description: The palace is considered the 'best paved house-palace in Europe' owing to its collection of Roman mosaics and marble floors in the 'opus sectile' geometric style, which paved practically the whole of the ground floor. There is also a collection of well parapets, vases, amphora, columns and sculptures of incalculable worth. On the upper floor you can visit the residences previously inhabited by the Countess and her descendants, up to only a few years ago; extremely well-preserved, they are today filled with ornaments and furniture from all over the world, priceless artwork by Van Dyke, Bruegel, Alonso Cano, among others, as well as collections of porcelain and glass.
    crowd_level: null
    best_months: []
    source_ref: Seville > See > Landmarks
  - id: andalusia-seville-casa-de-pilatos
    name: Casa de Pilatos
    kinds:
      - historic_site
    description: A 16th-century palace and generally thought to be one of the best in the city.
    crowd_level: null
    best_months: []
    source_ref: Seville > See > Landmarks
  - id: andalusia-seville-palacio-arzobispal
    name: Palacio Arzobispal
    kinds:
      - historic_site
    description: It is in the historical section of the city and is home to various clergy and the Archbishop. On the outside you only can catch a glimpse of the patio but on the inside there are important works of art.
    crowd_level: null
    best_months: []
    source_ref: Seville > See > Landmarks
  - id: andalusia-seville-archivo-general-de-indias
    name: Archivo General de Indias
    kinds:
      - other
    description: This Renaissance building houses extensive archives relating to the Spanish conquest of the Americas, and is designated a UNESCO World Heritage Site. Included in the collection are the diaries of Columbus. The archive hosts rotating special exhibits.
    crowd_level: null
    best_months: []
    source_ref: Seville > See > Landmarks
  - id: andalusia-seville-metropol-parasol
    name: Metropol Parasol
    kinds:
      - beach
      - religious_site
      - food
    description: An enormous wooden structure, designed by German architect Jürgen Mayer-Hermann, inspired by the Cathedral of Seville and in the form of giant mushrooms. Known to locals as 'las setas' (the mushrooms), the structure covers the Central Market and the Antiquarium; the top level contains a restaurant and provides some of the best views of Seville.
    crowd_level: null
    best_months: []
    source_ref: Seville > See > Landmarks
  - id: andalusia-seville-barrio-santa-cruz
    name: Barrio Santa Cruz
    kinds:
      - religious_site
      - nightlife
    description: Barrio Santa Cruz is the old Jewish Quarter, the winding narrow lanes just east of the cathedral and north of Alcázar. It's the most charming part of the city, with lots of bars and eating places, but it's also the most touristy.
    crowd_level: null
    best_months: []
    source_ref: Seville > See > Landmarks
  - id: andalusia-seville-museo-de-bellas-artes
    name: Museo de Bellas Artes
    kinds:
      - museum
      - religious_site
      - food
    description: Considered by some as the second most important fine arts museum in Spain after the Prado in Madrid. The museum building is a former mercy convent renewed in the 17th century and the 15 exhibition rooms show a comprehensive picture of Sevillian art from the Gothic period to the early trends of the 20th century. The square just outside hosts an open-air art market on Sundays until around 13:30. Plenty of original paintings on local topics, although some not so interesting bits as well!
    crowd_level: null
    best_months: []
    source_ref: Seville > See > Museums and galleries
  - id: andalusia-seville-museo-arqueologico-de-sevilla
    name: Museo Arqueológico de Sevilla
    kinds:
      - museum
    description: It has one of the best collection of Roman-era artifacts in Spain, brought from nearby Italica.
    crowd_level: null
    best_months: []
    source_ref: Seville > See > Museums and galleries
  - id: andalusia-seville-museo-antiquarium
    name: Museo Antiquarium
    kinds:
      - historic_site
      - museum
    description: A museum with excavated Roman and Moorish remains, discovered during construction of the Metropol Parasol. You can enter for free if you show your ticket for the alcazar, even if the ticket is a few days old.
    crowd_level: null
    best_months: []
    source_ref: Seville > See > Museums and galleries
  - id: andalusia-seville-centro-andaluz-de-arte-contempraneo
    name: Centro Andaluz de Arte Contempraneo
    kinds:
      - museum
      - religious_site
    description: Contemporary art museum in the former Carthusian monastery of Santa Maria of Las Cuevas, which has a fascinating history as a clay mine, monastery, and ceramics factory. The site and expansive grounds are worth a visit in their own right, including a striking rose window, industrial chimneys, and orange orchards. This was one of the places where the remains of Christopher Columbus were buried, before ending up in the Cathedral.
    crowd_level: null
    best_months: []
    source_ref: Seville > See > Museums and galleries
  - id: andalusia-seville-horse-drawn-carriage
    name: Horse-drawn carriage
    kinds:
      - nature
      - religious_site
    description: Horse-drawn carriage rides found near the cathedral take you to the nearby park and other sites of interest. For the sake of the animals, try to avoid carriage rides in the heat of the day in summer.
    crowd_level: null
    best_months: []
    source_ref: Seville > Do
  - id: andalusia-seville-museo-del-baile-flamenco
    name: Museo del Baile Flamenco
    kinds:
      - historic_site
      - museum
    description: Offers an experience for all the senses with ambiental music, videos, touch-screens and artifacts to be found in this 18th century building at the heart of the historical Barrio Santa Cruz. On Friday and Saturday evenings a spectacular show is hosted at a discounted price for visitors to the museum. Flamenco art and photography exhibitions are also on display and dance, singing, percussion and guitar lessons are offered.
    crowd_level: null
    best_months: []
    source_ref: Seville > Do > Flamenco
  - id: andalusia-seville-la-casa-del-flamenco
    name: La Casa del Flamenco
    kinds:
      - other
    description: A good spot to see real flamenco.
    crowd_level: null
    best_months: []
    source_ref: Seville > Do > Flamenco
  - id: andalusia-seville-la-carboneria
    name: La Carbonería
    kinds:
      - other
    description: Offers free flamenco shows nightly. Arrive early for good seats.
    crowd_level: null
    best_months: []
    source_ref: Seville > Do > Flamenco
  - id: andalusia-seville-semana-santa
    name: Semana Santa
    kinds:
      - other
    description: The sombre Easter week processions feature thousands of people and go on all week, a spectacular display of conspicuous Catholicism.
    crowd_level: null
    best_months: []
    source_ref: Seville > Do > Festivals
  - id: andalusia-seville-feria-de-abril
    name: Feria de Abril
    kinds:
      - beach
    description: Also known as "Feria de Sevilla" - a release after the somberness of Semana Santa. To say this is a huge party would be an understatement. Most if not all of Seville takes a week's holiday (the Wednesday of Feria week is a public holiday) and they plan for the fair months in advance. The fair is close to the river. It covers a huge area and contains hundreds of private and public casetas which are laid out to form streets. Casetas are small marquees and you can only get into the private ones if invited. The public ones are large but just as much fun. The day is naturally split in two and between 12:00 and 20:00 the streets of the fair throng with horses as riders and carriages strut their stuff dressed in traditional Spanish robes. After 20:00 the streets are cleared and "Calle del Inferno" comes to life. This must be one of the best funfairs in Europe – it takes weeks to assemble and pack up. Experience traditional dress, flamenco dancing (and the "sevillanas", the traditional dance of the region of Seville), guitars, fino, great tapas and participants who dance with gusto and eat and drink the day and night away.
    crowd_level: null
    best_months: []
    source_ref: Seville > Do > Festivals
