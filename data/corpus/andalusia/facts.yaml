    name: Hiking
    kinds:
      - hiking
      - nature
      - viewpoint
    description: There are a number of hiking trails around Ronda, including eight with trailheads beginning in Ronda. The tourist information office carries maps and trail descriptions for €1/trail; alternatively their website has a comprehensive list of routes with GPS coordinates and trail descriptions available for free download. One of the most popular routes is Route 3 (SL-A 38), which descends to the bottom of the Tajo Gorge passing by several excellent viewpoints of the Puente Nuevo. (A word of caution is advised, though, as if there is an extended dry spell, the gorge can stink because sewage is still released into the river.)
    crowd_level: null
