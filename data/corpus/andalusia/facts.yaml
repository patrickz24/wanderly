  - id: andalusia-granada-plaza-isabel-la-catolica
    name: Plaza Isabel la Catolica
    kinds:
      - other
    description: At the junction of Granada's two grand boulevards is this small square with a prominent statue of Columbus unfurling a contract with Queen Isabel, outlining the terms of their agreement in preparation for his first voyage to the Americas, an event which likely occurred in Granada. A pleasant fountain surrounds the statue and there are benches nearby, allowing you to relax and take in the passing crowds of vehicles and people.
    crowd_level: null
    best_months: []
    source_ref: Granada > See > Central Granada
  - id: andalusia-granada-cathedral-of-granada
    name: Cathedral of Granada
    kinds:
      - hiking
      - historic_site
      - religious_site
    description: Towering over the surrounding blocks is this spectacular 16th century structure, the second-largest cathedral in Spain and noted for its bright Renaissance interior. Constructed after the Reconquista of Granada to replace the mosque on the site, the cathedral was laid out with Gothic foundations but built in the Renaissance style and decorated with Baroque elements. Upon entering you'll be behind the main altar, located beneath the towering circular Capilla Mayor (sanctuary) with its magnificent domed ceiling. Surrounding the sanctuary and the pews are a series of chapels with magnificent artwork, and the sacristy (tucked away on your right immediately after entering) holds a collection of fine paintings, mirrors, and furnishings. Additionally, the spectacular façade of the cathedral (on the west side of the structure, opposite the Gran Via) is worth walking around outside to view - based on the design of a triumphal arch, it overshadows the small square below.
    crowd_level: null
    best_months: []
    source_ref: Granada > See > Central Granada
  - id: andalusia-granada-royal-chapel
    name: Royal Chapel
    kinds:
      - historic_site
      - museum
      - religious_site
    description: Commissioned after the Reconquista of the city, the Royal Chapel holds the tombs of King Ferdinand II and Queen Isabella I, the famed Catholic Monarchs who conquered the city and decided to be buried at the site of their victory. The chapel was constructed in Gothic style but the intricate marble tombs are done in Renaissance style. Additionally, Ferdinand and Isabella's heirs Juana I (Juana la Loca) and Philip I (Felipe el Hermoso) are buried here. Aside from the beautiful and intricate artwork in the chapel and high altar there is also a museum on-site with a number of objects symbolizing Ferdinand and Isabel's rule, including Isabella's art collection, crown and sceptre and Ferdinand's sword.
    crowd_level: null
    best_months: []
    source_ref: Granada > See > Central Granada
  - id: andalusia-granada-plaza-de-bib-rambla
    name: Plaza de Bib-Rambla
    kinds:
      - historic_site
      - religious_site
      - food
    description: A pleasant square with a view of the cathedral's tower, this plaza was originally the center of Moorish Granada, a bustling focus point of markets and festivals. Under Christian rule the square was expanded and used as a focal point of Catholic processions. Today the square is a quiet place to relax, enjoy a coffee or a meal, or take in the colorful flowers and bubbling fountain.
    crowd_level: null
    best_months: []
    source_ref: Granada > See > Central Granada
  - id: andalusia-granada-alcaiceria
    name: Alcaiceria
    kinds:
      - religious_site
      - food
    description: South of the Cathedral is this set of winding alleyways which were originally home to a Moorish silk market under Granada's Muslim rule. Although the market initially survived the Reconquista, Philip II had it shut down and a fire destroyed what was left in 1850. Today's market was rebuilt in the late 19th century for tourists and holds mostly souvenir stores underneath the Moorish-style archways decorating the walls. While the wares are mostly tacky novelties, the architecture is worth a look.
    crowd_level: null
    best_months: []
    source_ref: Granada > See > Central Granada
  - id: andalusia-granada-corral-del-carbon
    name: Corral del Carbón
    kinds:
      - historic_site
    description: One of the rare bits of Moorish architecture left in the central district, this courtyard building is perhaps the oldest monument in Granada. Originally the building was used as a caravanserai - a place for merchants to rest and store goods - and was one of many surrounding the Alcaiceria. Later it was adapted for theater plays and today you can buy tickets for musical events here. Walk through the grand Moorish door and enjoy the brick-walled courtyard.
    crowd_level: null
    best_months: []
    source_ref: Granada > See > Central Granada
  - id: andalusia-granada-plaza-nueva
    name: Plaza Nueva
    kinds:
      - historic_site
      - religious_site
      - food
      - nightlife
    description: Long an important center of life in Granada, Plaza Nueva is the city's oldest square, situated beneath the Alhambra and at the foot of the Albayzin, and today links these attractions with the newer parts of the city to the west. Surrounding the square is a multitude of bars and tapas restaurants (making the square the city's center for nightlife) as well as several important buildings such as the Royal Chancellery (Real Chancilleria), the House of Pisa (Casa de Los Pisa), and the Church of Santa Ana on the east side of the square, a 16th century church constructed in Mudejar style with a lovely tower.
    crowd_level: null
    best_months: []
    source_ref: Granada > See > Central Granada
  - id: andalusia-granada-museo-san-juan-de-dios
    name: Museo San Juan de Dios
    kinds:
      - museum
    description: A very rich religious art collection.
    crowd_level: null
    best_months: []
    source_ref: Granada > See > Central Granada
  - id: andalusia-granada-centro-jose-guerrero
    name: Centro José Guerrero
    kinds:
      - museum
    description: A small museum dedicated to the Granada-born painter José Guerrero. The uppermost floor has a permanent collection of his abstract expressionist paintings, while the lower two floors show temporary exhibits of contemporary art and photography by Spanish and international artists.
    crowd_level: null
    best_months: []
    source_ref: Granada > See > Central Granada
  - id: andalusia-granada-alcazaba
    name: Alcazaba
    kinds:
      - nature
      - historic_site
      - viewpoint
    description: Alcazaba. The ruins of a massive fortress perched atop the crest of the hill overlooking the city, this is the oldest part of the Alhambra and offers some of the finest views of anywhere in the complex, with an expansive panorama from the top of the prominent tower that gives you a spectacular view of nearly the entire city and the Sierra Nevada mountains. Within the fort's walls are the ruins of a town which once held soldier's homes and baths, though today only the outline of these rooms remain.
    crowd_level: null
    best_months: []
    source_ref: Granada > See > The Alhambra
  - id: andalusia-granada-palace-of-charles-v
    name: Palace of Charles V
    kinds:
      - historic_site
      - museum
    description: Palace of Charles V (Palacio de Carlos V). A more recent addition to the Alhambra, this 16th century building was commissioned following the Reconquista by Charles V as a royal residence close to the Alhambra palace. The square two-level structure is done in Renaissance style with an impressive circular courtyard ringed by a colonnade within. The building is also home to two museums, the Museo de la Alhambra on the lower floor with a collection of artifacts and art from the Alhambra, and the Museo de Bellas Artes, a small fine art museum on the upper floor, as well as a couple of changing museum exhibits which regularly feature art with some connection to the Alhambra.
    crowd_level: null
    best_months: []
    source_ref: Granada > See > The Alhambra
  - id: andalusia-granada-palacios-nazaries
    name: Palacios Nazaries
    kinds:
      - nature
      - historic_site
    description: Palacios Nazaries. The Nasrid royal palace and the primary (and thus most crowded) attraction of the Alhambra complex, the palace is an impressive, at times breathtakingly beautiful work of architecture. Visitors get to see spectacular archways and windows, carved wooden ceilings, intricate molded-plaster work and colourful ceramic tiles at nearly every turn as they meander between lovely rooms and lush courtyards. Everyone starts their tour in the Mexuar, a set of administrative rooms with a beautiful prayer room and a small square courtyard with the golden Façade of Comares, before emerging in the Court of the Myrtles, a rectangular courtyard with a long pool of water flanked on each side by a myrtle hedge (hence the name). At the end of the courtyard you can enter a room to view the twelve Lion Statues from the fountain in the Court of the Lions, which is undergoing renovation. Cross to the other end of the Court of the Myrtles to enter the Ship Room, with its spectacular carved wooden ceiling in the shape of an upside-down hull, and the Chamber of the Ambassadors, the palace's largest and perhaps most spectacular room, which once functioned as the throne room and features a star-studded wooden ceiling, intricately carved stucco walls and beautiful arched windows. From here you'll pass through a series of small rooms, including the Washington Irving Room, where Washington Irving wrote Tales of the Alhambra, as well as down an open-air hallway with an excellent view of an adjacent courtyard (the Court of Linda-Raja) and the Albayzín. Passing by the old bath house you'll enter the Hall of the Two Sisters, a spectacular domed room with an intricate stucco ceiling and lovely views of the Court of Linda-Raja. From here you can navigate around the edge of the Court of the Lions (under renovation) to the Hall of the Abencerrages, structurally similar to the Hall of the Two Sisters. At this point you can exit the palace, which will place you near the entrance to the Partal Gardens.
    crowd_level: null
    best_months: []
    source_ref: Granada > See > The Alhambra
  - id: andalusia-granada-generalife
    name: Generalife
    kinds:
      - nature
      - historic_site
    description: Generalife. The lush and gorgeous gardens of the Nasrid kings, the expansive Generalife is the finest set of Moorish style gardens in Andalusia, positioned on a hill situated at the rear of the complex overlooking the Alhambra palace. Within you'll find beds of colorful flowers, more exquisite architecture, leaping fountains and cool shade. There are two entrances to the Generalife, one at the ticket booth on the east side of the complex and another next to the Palacios Nazaries which will take you through the Partal Gardens, a collection of palace gardens with flowing water streams and a large pool of water which reflects a nearby portico. From the Partal you can follow the Promenade of The Towers, the remains of the main wall and its adjoining towers that separate the Alhambra palace grounds from the Generalife. As you cross a bridge over a small canyon you'll enter the Generalife proper, where you can follow a promenade past the amphitheater to the Lower Gardens, a collection of hedge rows with rectangular ponds at the center and colorful flower beds throughout. Past this is the Generalife Palace, the white structure sitting atop the hill and the highlight of a visit to the gardens, for it is within that you will find spectacular views, lovely architecture, and the much-photographed Court of the Main Canal, with its crossing jets of water that arc over the rectangular pool. Nearby is the Soultana's Court, another picturesque courtyard with leaping fountains. Above the palace are the High Gardens, where you can find a gorgeous long pergola and the Water Stairway, which true to its name is a beautiful stairway with water flowing down its parapets. The gardens are huge, but the layout is simple as everything in the Generalife can be seen along a long, circular path.
    crowd_level: null
    best_months: []
    source_ref: Granada > See > The Alhambra
  - id: andalusia-granada-san-jose-church
    name: San José Church
    kinds:
      - historic_site
      - religious_site
    description: Located in a spot previously occupied by the Almorabitín, or mosque of morabites, and is one of the oldest churches in Granada, dating back to the sixteenth century. The architecture of the old mosque is still visible in parts, particularly in the minaret-turned-bell tower.
    crowd_level: null
    best_months: []
    source_ref: Granada > See > Albayzín
  - id: andalusia-granada-san-nicolas-viewpoint
    name: San Nicolas Viewpoint
    kinds:
      - nature
      - viewpoint
    description: The most popular attraction in the Albayzin for tourists, this spot offers a spectacular view of the Alhambra and the mountains behind, as well as excellent vistas of the city and up the Rio Darro canyon.
    crowd_level: null
    best_months: []
    source_ref: Granada > See > Albayzín
  - id: andalusia-granada-mosque-of-granada
    name: Mosque of Granada
    kinds:
      - nature
      - historic_site
      - religious_site
    description: Following the Reconquista, Islam was banished from Spain and its practitioners were persecuted, effectively stomping out any practice of the religion in Spain for centuries thereafter. But Islam has been making a comeback in Spain and this mosque, built in 2003, stands as a link with the Muslim Granada of old. The mosque maintains an open-door policy and while you need to arrange an appointment to see the main prayer spaces, you are free to enter the fragrant garden and take in the architecture of the rather humble yet beautiful building. Even if you have little interest in Islam the place is still worth visiting for the garden's marvelous view of the Alhambra and for the sight of Moorish-style architecture that's newly constructed rather than ancient and crumbling.
    crowd_level: null
    best_months: []
    source_ref: Granada > See > Albayzín
  - id: andalusia-granada-plaza-larga
    name: Plaza Larga
    kinds:
      - viewpoint
      - food
    description: A small and shady plaza, this is the center of Albayzín for its residents, removed from the tourist crowds of the San Nicolas Viewpoint, surrounded by local shops and restaurants and home to a local market on Saturday mornings. On the west edge of the plaza, tucked around a corner, is Puerta Nueva, a passageway to Placeta de las Minas situated at the end of a remaining section of defensive wall which once protected the Albayzín. The wall itself is mostly inaccessible, but excellent views of the wall, which really speak to how imposing it must have looked from the outside, are available from the Mirador de San Cristobal uphill from Plaza Larga (alternatively you can just walk along Cuesta de Alhacaba west from Plaza Larga from excellent views from beneath the wall).
    crowd_level: null
    best_months: []
    source_ref: Granada > See > Albayzín
  - id: andalusia-granada-hamman-el-banuelo
    name: Hamman El Bañuelo
    kinds:
      - historic_site
      - viewpoint
    description: An unassuming-looking building from the outside, the Bañuelo is the ruins of perhaps the most well-preserved Arabic bath house in Spain. Once a popular socializing spot during Muslim Granada, most of the bath houses in the city were destroyed followed the Reconquista - this one survived due to the construction of a private home above. Inside you can view the beautiful architecture and learn how the bath house functioned, with its hot and cooling rooms and scenic courtyard.
    crowd_level: null
    best_months: []
    source_ref: Granada > See > Albayzín
  - id: andalusia-granada-paseo-de-los-tristes
    name: Paseo de los Tristes
    kinds:
      - historic_site
      - food
    description: Perched above the Rio Darro at the end of Carrera del Darro, this plaza was once on the busiest gathering spots in Granada, positioned along a curve of the river between the Alhambra and the Albayzin. Today it is a popular place to eat owing to the restaurants lining the north side of the square and the magnificent views of the Alhambra palace it offers.
    crowd_level: null
    best_months: []
