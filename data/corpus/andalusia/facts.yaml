  - id: andalusia-ronda-iglesia-de-santa-maria-la-mayor
    name: Iglesia de Santa Maria la Mayor
    kinds:
      - beach
      - historic_site
      - religious_site
    description: This is most important church in Ronda, built after the reconquista on the site of town's former principal Moorish mosque, with construction lasting from 1485 until the end of the 17th century. The only features remaining from the mosque are the arch of the mirhab and a section of its wall covered with stucco, both hidden behind the retable of the main altar; additionally the former minaret was converted to the bell tower. This is a Gothic-style church that, inside, has elements of the Baroque and Rococo, as the church was partly rebuilt following the earthquake of 1580. The walnut and cedar choir seating dates from the Renaissance period. An unusual feature is a balcony on the front side of the church which faces the Ayuntamiento (city hall).
    crowd_level: null
