    source_ref: Granada > See > Sacromonte
  - id: andalusia-granada-sacromonte-abbey
    name: Sacromonte Abbey
    kinds:
      - religious_site
    description: Founded in the seventeenth century. Local legend says that the catacombs under the church are where the city's first bishop (and today Granada's saint) San Cecilio underwent his martyrdom.
