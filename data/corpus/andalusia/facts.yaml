  - id: andalusia-lake-negratin
    name: Lake Negratin
    kinds:
      - beach
      - nature
      - food
    description: Lake Negratin is situated at the foothills of Mount Jabalcón. As one of Europe's largest lakes, it really is worth seeing not least for the most magnificent lunar-landscape that surrounds it. The rock formations and the colours it produces during different times of the day can be likened to those of the Grand Canyon. There is a man-made beach where you can laze the day away, a number of restaurants dotted round the lake and on a nice day you can swim or take out a pedalo boat, which might lead you to pink flamingos and various other wildlife.
    crowd_level: null
    best_months: []
    source_ref: See
  - id: andalusia-seron
    name: Seron
    kinds:
      - historic_site
    description: Seron is nestled on the lower slopes of the Sierra de los Filabres and is a picturesque town that cascades down the hillside. Dominated by its Castle, which sits at the very top, Seron is famous for its ham and provides a more traditional experience of Andalusian life. It is a beautiful location to start your exploration of the Filabres, or visit at the right time of year and you might find yourself submerged in a vibrant fiesta.
    crowd_level: null
    best_months: []
    source_ref: See
  - id: andalusia-las-menas
    name: Las Menas
    kinds:
      - historic_site
      - village
    description: Las Menas, an old mining village abandoned thirty years ago, makes an interesting stop in the Sierra de los Filabres. You can investigate old ruins crumbling amidst the most breathtaking countryside, stop for coffee and cake at the hotel and even camp for the night.
    crowd_level: null
    best_months: []
    source_ref: See
