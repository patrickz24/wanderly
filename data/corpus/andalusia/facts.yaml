  - id: andalusia-granada-museo-cuevas-sacromonte
    name: Museo Cuevas Sacromonte
    kinds:
      - nature
      - historic_site
      - museum
    description: This museum offers the chance to get to know this neighborhood, with geological and historical exhibits on the caves, the biology, the people and the form of living as well as the traditional handicrafts of the locals.
