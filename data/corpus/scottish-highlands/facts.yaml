    description: A ruined medieval castle built in the 1270s, and patched up but little altered since. It comprises a quadrangular courtyard, 31 m by 27 m, surrounded by a sturdy curtain wall with round towers at each corner. The largest, Comyn Tower, was the castle keep. The three sides not facing the river were protected by a water-filled ditch, and both entrances were defended by a portcullis. The ruins are unstable and fenced off for safety.
