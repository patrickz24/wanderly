  - id: scottish-highlands-aviemore-ben-macdui
    name: Ben Macdui
    kinds:
      - hiking
      - nature
      - adventure
    description: Ben Macdui is the highest of the Cairngorms, at 1309 m (4295 ft). Since 1847 it's been the second highest mountain in Britain, when the Ordnance Survey showed that Ben Nevis pipped it at 1345 m (4411 ft). The trail is 11 miles (17.5 km) and takes 6-8 hours. Start from the base car park swinging west of Windy Ridge; the route is obvious and involves nothing technical, but keep a wary eye on the weather. You return via Cairngorm summit and Windy Ridge. Queen Victoria ascended in 1859 from the east, by pony from Balmoral to Loch Etchachan then hiking the rest. Hiking Ben Macdui may be tricky if you don't have a car, as it will be hard to make it back to the ski centre in time for the last bus back to Aviemore.
