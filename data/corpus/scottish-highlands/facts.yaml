    description: The Roman Catholic Cathedral was designed by Sir Giles Gilbert Scott (who designed the iconic red telephone box) and built in Neo-Gothic style between 1932 and 1959. In medieval times the area's senior church was St Moluag's on the Isle of Lismore, nowadays a Church of Scotland parish church. The RC Diocese of Argyll and The Isles was re-established in 1878 but bishop and congregation were in makeshift premises, including a tin hut, until St Columba's was completed.
