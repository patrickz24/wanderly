  - id: scottish-highlands-fort-william-lock-lochy
    name: Lock Lochy
    kinds:
      - other
    description: Lock Lochy is the first natural water encountered on the canal, a nine mile reach to Laggan where the ascent continues. (So yes, these could be called the Loch Lochy locks, which, when locked ...) Another straight run connects Loch Oich, the highest part of the system. (Higher still, Loch Garry feeds water to the canal via the River Garry, but that river isn't navigable.) From Loch Oich the canal continues northeast, descending by another ladder of locks into Loch Ness, the magnificent natural channel at the heart of the canal system. At its north end, canal and River Ness flow down from Dochgarroch Weir towards the sea at Inverness.
