  - id: scottish-highlands-oban-castle-stalker
    name: Castle Stalker
    kinds:
      - hiking
      - nature
      - historic_site
    description: A well-preserved four-storey tower house on a tidal islet in Loch Linnhe, built from 1440. "Stalker" is from Gaelic Stalcaire, a hunter or falconer - King James IV often used it as a hunting lodge in the 1490s. The castle changed hands several times, often with murder involved (the last such being in Sarawak in 1947), and its last military role was as a government stronghold in the 1745 rebellion. It fell derelict from 1800 but was restored 1965-75. Tours are offered Apr-Sept but need high tide for boat access, the low tide causeway is too rough and slippery — see the castle website for availability. The photogenic site is sometimes a film location, best known is as "Castle Aaarrrrgghh" in Monty Python and the Holy Grail. To just admire the exterior, either have a cuppa at Castle Stalker View Cafe to use their car park, or use the free car park a mile north, and pick up the coast footpath.
    crowd_level: null
    best_months: []
    source_ref: Oban > See
