    description: Cairngorm Mountain base is the end of the road and bus route from Aviemore, and base station for the mountain railway, which is closed for engineering works as of January 2024. The car park costs £4 per day. The railway is a funicular, with the "up" car counterbalancing the "down" car. An adult return costs £22. Outside ski season, all you can do is ride up to Ptarmigan restaurant at the top station, admire the view and overpriced merchandise, then ride back down. You may not go out onto the hill — to prevent damaging footfall on the Alpine habitat — or bring dogs. Hill walkers aiming for the heights must therefore trudge up the slope from the car park, but are permitted to ride down again.
