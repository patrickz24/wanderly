    name: Strathspey Railway
    kinds:
      - family
    description: Strathspey Railway is a 10-mile heritage standard-gauge railway, often steam-hauled, with its south terminus at Aviemore Station Platform 3. The main collection of locomotives and rolling stock is at Boat of Garten, where you can also start your trip, but excursions from Aviemore make a long stop there. The train then chuffs on to Broomhill, where the line ends in the fields, so it reverses. Extension to Grantown is thwarted by the A85, which the council promised to re-align then baulked at the cost. Trains run Apr-Oct W-Su, with three round trips taking 1 hr 45 min. Return fares in 2023 are adult £19.50, conc £17.50, child £9.75, dog £3, meals extra.
