  - id: scottish-highlands-fort-william-the-caledonian-canal
    name: The Caledonian Canal
    kinds:
      - other
    description: The Caledonian Canal is a coast-to-coast channel built by Thomas Telford in the early 19th century. It uses the string of lochs and rivers along the Great Glen, so it's 60 miles long but only 22 miles are man-made. Commercially and strategically it was obsolete as soon as it was completed in 1822, as shipping had outgrown it, and round-the-coast navigation was much safer since the end of the Napoleonic wars. It fell into disrepair but was rehabilitated for pleasure craft. At the south end, it starts from Loch Linnhe by a short ladder of locks at Corpach.
