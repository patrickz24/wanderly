    name: McCaig’s Tower
    kinds:
      - nature
      - historic_site
      - museum
      - family
    description: John Stuart McCaig (1823-1902), a local banker, was aiming for something like the Colosseum in Rome. At his death only the granite circular shell was complete, resembling a vast salad-drainer with its lancet windows, and dominating the view for miles around. Inside is simply a public garden and picnic spot where the pipe band sometimes plays, and the museum, art gallery and heroic statues of himself and family never happened. You can approach via "Jacob's Ladder", the steps from the Esplanade.
