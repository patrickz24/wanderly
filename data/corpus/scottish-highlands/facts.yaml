  - id: scottish-highlands-aviemore-cairngorm-summit
    name: Cairngorm summit
    kinds:
      - hiking
      - nature
      - adventure
    description: 'Cairngorm summit is at 1245 m (4084 ft), a "Munro" and the sixth highest mountain in Britain. Ascend the rocky hillside to see tinkling brooks, nesting birds, and staggering views of the surrounding mountains (as long as clouds aren''t blocking the view). It''s only half a mile south of the funicular top station, but walkers must ascend from the base station. The simplest and shortest route is Windy Ridge, straight up alongside the funicular, but it misses the best of the scenery — you might want to come down that way. North Corries is a longer route taking in the tops of corries or cwms at the head of glaciated valleys. Skiers have the easiest ascent as you can park your kit around Ptarmigan at 1080 m then stride out. Of course that takes you off-piste in clumsy ski boots, beyond help from the ski patrol if you had a mishap. On the peak you''ll find a large cairn and an automated weather station. If you get to the peak and the view is hidden by clouds, never fear: they may dissipate in a few minutes, and if not, nearby side trails lead to lower vantage points with worthwhile views of their own.'
    crowd_level: null
