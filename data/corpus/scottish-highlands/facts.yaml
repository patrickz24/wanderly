  - id: scottish-highlands-fort-william-lochaber-geopark
    name: Lochaber Geopark
    kinds:
      - nature
    description: 'Lochaber Geopark in High St (M-Sa 10AM-4PM) promotes awareness and organises trips and study around the region''s weird geology. This played a key role in shaping 19th- and 20th-century understanding of how the world''s landscapes were constructed: it was realised that the Caledonian Mountains once stretched through Svalbard and Greenland into the Appalachians, until sundered by the new Atlantic Ocean. The geopark stretches from Rannoch Moor in the south to Glen Garry in the north, and from Loch Laggan in the east to the Small Isles out west. For instance 20 miles away are the "Roads of Glen Roy": this glen above the Spean valley has three long parallel ledges on the hillside that look man-made. They were in fact cut by ice grinding along the shore of a vanished lake, which lay at different levels during a cold period after the last Ice Age when arctic conditions returned.'
