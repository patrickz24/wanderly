  - id: scottish-highlands-aviemore-loch-an-eilein
    name: Loch an Eilein
    kinds:
      - hiking
      - nature
      - historic_site
      - adventure
    description: Loch an Eilein is fringed by a path, a gentle 5-mile (8-km) circuit. In the woods are remains of old lime kilns and logging operations. However the main attraction is views of the ruined 14th-century castle on an islet; it could be reached by causeway until the loch water level was raised in the 18th century. In 1690 it saw the last action in Scotland of the original Jacobites, the forces of the ousted King James II / VII. Fleeing from a double drubbing at Cromdale, they tried to seize the castle but were repulsed by the stout widow who held it. The Hanoverians were hard on their heels so they scarpered, and it would fall to James' son the "Old Pretender" and grandson the "Young Pretender" (Bonnie Prince Charlie) to continue the cause. That was finally vanquished in 1746 at Culloden, to live on only in romanticising songs. The loch is reachable by a trail from Rothiemurchus. Bring a map or download an OpenStreetMap-based app like OsmAnd or Mapy.cz to help you navigate. Turn left just before Lochan Mor (the turn is slightly hard to spot, but if you miss it the other trail will also go to Loch An Eilein). You may see deer on the way, especially if you set off early before the other walkers have scared them away. It takes about an hour to walk to Loch An Eilein from Aviemore, and the loch is also reachable by car if you prefer. The circuit around the loch is popular with dog walkers and mountain bikers.
    crowd_level: null
    best_months: []
    source_ref: Aviemore > See
    crowd_evidence: []
    months_evidence: []
