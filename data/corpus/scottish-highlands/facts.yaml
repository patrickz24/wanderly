    description: Lairig Ghru is a 19-mile (31-km) route through the Cairngorms from Coylumbridge to Linn of Dee above Braemar. You need transport set up at both ends; the first bus of the day to Coylumbridge is leaving it late to get through the pass before nightfall. It's heavy, boggy going, with snow and ice underfoot in winter. There are no bail-out options if you get cold and weary midway.
