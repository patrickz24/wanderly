    description: Also known as Chiesa di Santa Lucia fuori le mura as it was behind the walls (extra moenia) a Byzantine church built, according to tradition, in the same place of the martyrdom of the saint in 303 AD. The current appearance is from the 15th-16th centuries. The most ancient parts still preserved include the portal, the three half-circular apses and the first two orders of the belfry. Next to the church is located the sepolcro (tomb) of the Santa Lucia, at the place where she as regarded was executed. This church hosts "Burial of Saint Lucy" by Caravaggio which was located at the Chiesa di Santa Lucia alla Badia at the Piazza Duomo. Under the church there are catacombs which are not open to the public.
