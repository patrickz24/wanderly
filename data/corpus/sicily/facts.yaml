    name: Catacombe dei Cappuccini
    kinds:
      - religious_site
      - village
      - family
    description: The catacombs of the Capuchin convent contain over 8,000 mummified ex-residents from Palermo and its surrounding villages, some merely clothed skeletons, other remarkably well-preserved and lifelike. Well worth a visit, interesting, if slightly morbid. Children may either find it exciting or terrifying, and it must be the responsibility of their parents to think carefully before taking them. You can arrive via the tram line and a 10- to 15-minute walk. Your visit will not take longer than one hour. No photography allowed
    crowd_level: null
