    kinds:
      - historic_site
    description: The building has an important role in the political life of the city, since it houses the mayor and the offices of the municipality of Palermo. Construction began in 1463. It is open for visits to see the sumptuous meeting rooms, the "Sala Rossa" (seat of the mayor), the "Sala Gialla" (seat of the municipal government), the "Sala delle Lapidi" (seat of the city council), and the "Sala Garibaldi".
