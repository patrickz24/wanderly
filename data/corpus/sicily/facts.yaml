    description: 'A square at the intersection of Via Etnea with Via di Sangiuliano. It is somewhat reminiscent to the other octagonal squares in Italy: Quattro Canti at the piazza Vigliena in Palermo, Quattro Canti in Paternò, and Quattro Fontane in Rome, next to the church of San Carlino by Francesco Borromini.'
