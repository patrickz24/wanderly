    description: It was built in the 13th century as a royal castle of the Kingdom of Sicily, and ilater became the seat of the Sicilian Parliament. It hosts the Museo Civico (civic museum), which displays Greek and Roman artifacts from the city; art from the 17th-19th centuries; 2000 bronze figurines from the Archaic, Siceliot, Greek, Etruscan-Italic and Hellenistic eras; and temporary exhibitions.
