  - id: sicily-palermo-church-of-the-gesu
    name: Church of the Gesù
    kinds:
      - religious_site
    description: The Gesu Church is one of the most architecturally important in Palermo. Constructed between 1564–1633, its late date of completion resulted in an abundant use of polychrome marbles on both floors and walls. This form of decoration, which gradually evolved in Sicily from the beginning of the 17th century, was a mark of the beginning of the Sicilian Baroque period, which was to give Sicily almost an architectural national identity. The church has a modest facade and it's hidden in back street in central Palermo, unlike the great cathedral this one you have to look for.
    crowd_level: null
    best_months: []
    source_ref: Palermo > See
  - id: sicily-palermo-piazza-pretoria-and-the-fontana-pretoria
    name: Piazza Pretoria and the Fontana Pretoria
    kinds:
      - historic_site
    description: In 1573 the Senate of Palermo bought a fountain intended for the Palace of San Clemente in Florence, with the intention of placing it in the square. The large central fountain is the focal point for 16 nude statues of nymphs, humans, mermaids and satyrs. In 1860, the fountain was considered the representation of corrupt municipalities, and Palermo nicknamed the square with the nudity of the statues, the Square of Shame (Piazza della vergogna). This may have also been reflecting the prevailing influence of the Spanish Inquisition during that time.
    crowd_level: null
    best_months: []
    source_ref: Palermo > See
