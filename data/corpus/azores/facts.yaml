  - id: azores-pico-mount-pico
    name: Mount Pico
    kinds:
      - hiking
      - nature
      - viewpoint
      - adventure
    description: A stratovolcano 2351 m above sea level. It is the tallest mountain in Portugal. Climb the mountain in the afternoon so you can see the sunset when you reach the summit. Normally it takes 2 to 3 hours to climb, more if you are not fit. Then in the morning to see the sunrise, climb a little mountain called Pico Pequenino (Little Pico) that the mountain has on top. From there you can see the islands of Faial and São Jorge perfectly. To climb Mt Pico, you must register at the Mountain House at the base of the mountain, which controls the number of climbers each day, or register in advance (recommended) at montanhapico.azores.gov.pt.
    crowd_level: null
    best_months: []
    source_ref: Pico > Do
