    description: Visible only by boat, the grotto is the largest of the myriad caves that open at the base of the promontory "La Caveira", about 3 km south of the capital. The marine cave measures 25 x 50 m and is of volcanic origin. Like the nearby "gruta de galo", it used to be a hiding place for pirate ships that then gave themselves to the boarding of the galleons coming from Brazil and the other Portuguese colonies. Today Gruta dos Enxaréus is one of the major natural attractions of Flores.
