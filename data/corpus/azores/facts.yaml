    kinds:
      - nature
    description: A former beacon/lighthouse on the coastal peninsula of Ponta dos Capelinhos and Costa Nau that was constructed in the late 19th century. It is a symbol on the island, for the eruption of Capelinhos volcano, which occurred in 1957-58.
    crowd_level: null
