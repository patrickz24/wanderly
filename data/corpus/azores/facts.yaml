  - id: azores-faial-caldeira
    name: Caldeira
    kinds:
      - beach
      - nature
      - village
      - viewpoint
    description: The centre of Faial is occupied by a large crater, called "Caldeira". The road from the capital passes through Flamengos, the first village to be founded by European settlers. In its vicinity is the botanical garden. Also interesting is the trip along the "Ribeira dos Flamengos", a stream that crosses a very green valley. The descent into the crater is challenging and generally requires a local guide. You can observe the laurel forests that once covered the whole island. Once you have visited the Caldeira it is possible to descend in the direction of Praia Norte or in the area of ​​Capelo dominated by the lunar landscapes of the coast. The 3-km path, called "covered by Levada", is easily accessible. An extension of it begins near an artificial lake and penetrates through a tunnel inside a basaltic volcano "Cabeço dos Trinta" and then flows directly into the crater. Another excursion is to "Cabeço Gordo", the highest point of the island (1043 m) Which offers a panoramic view of the Caldeira.
    crowd_level: null
    best_months: []
    source_ref: Faial > See
    crowd_evidence: []
    months_evidence: []
  - id: azores-faial-capelinhos-volcano
    name: Capelinhos volcano
    kinds:
      - hiking
      - nature
      - historic_site
    description: A volcanic eruption lasted for 13 months, from 27 September 1957 until 24 October 1958, which may have been two overlapping volcanic eruptions. While enlarging the land by 2.4 km², it spawned 300 seismic events, hurled ash 1 km, destroyed 300 houses in the parishes of Capelo and Praia do Norte and caused the evacuation of 2,000 people (many of whom emigrated to the US and Canada). The ruined lighthouse and Visitors Center (which lies along the cliff from the volcano) are a tourist destination. A trail network runs from the Visitors Center and lighthouse to the caldera summit.
    crowd_level: null
    best_months: []
    source_ref: Faial > See
    crowd_evidence: []
    months_evidence: []
  - id: azores-faial-lighthouse-of-ponta-dos-capelinhos
