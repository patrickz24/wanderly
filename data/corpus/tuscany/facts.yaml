  - id: tuscany-florence-ponte-vecchio
    name: Ponte Vecchio
    kinds:
      - historic_site
      - museum
      - food
    description: 'The oldest and most celebrated bridge over the Arno, and the only Florentine bridge to survive World War II. The design is distinctive: it''s a three-arched bridge supporting a parade of shops supporting another bridge. It dates to 1345 (hence Ponte Vecchio, "old bridge"), with earlier bridges being swept away by floods, rebuilt and swept away again. At street level it''s a pedestrianised cobbled arch. It''s lined by shops, which were butchers until Renaissance times then - in an insight as dramatic as the discovery of perspective in painting - they realised that goldsmiths'' shops paid higher rents and didn''t stink; so from then to this day it''s just been overpriced jewellery shops and market stalls. Above these is the higher bridge, the Vasari Corridor, a private walkway added in 1565 so that the Medici Dukes could move between Palazzo Vecchio (Town Hall) and Palazzo Pitti (their blingy residence) without mixing with common folk. On the south bank, the Corridor nowadays continues as a gallery of the Uffizi, and there is sometimes talk of extending this over the bridge, or otherwise making the space accessible. Nothing''s come of this so far, so the common folk will have to continue admiring the scene from street level.'
    crowd_level: null
    best_months: []
    source_ref: Florence > See > Old town centre
    crowd_evidence: []
    months_evidence: []
  - id: tuscany-florence-santa-croce
    name: Santa Croce
    kinds:
      - historic_site
      - museum
      - religious_site
    description: Contains the monumental tombs of Galileo, Michelangelo, Machiavelli, Dante, Rossini, and many other notables in addition to artistic decorations. There is also great artwork in the church. The Museo dell'Opera di Santa Croce (included in ticket) displays a flood-damaged but still beautiful Crucifix by Cimabue (Giotto's teacher), which has become a symbol of the disastrous floods of 1966. The ticket also includes Pazzi Chapel, a perfectly symmetrical example of sublime neo-Classic Renaissance architecture.
    crowd_level: null
    best_months: []
    source_ref: Florence > See > Old town centre
    crowd_evidence: []
    months_evidence: []
  - id: tuscany-florence-santa-maria-novella
    name: Santa Maria Novella
    kinds:
      - beach
      - historic_site
      - museum
      - religious_site
    description: A beautiful church with great artwork, including a Trinity by Masaccio that is being restored as of April 2024 but can still be seen from the scaffold for an additional charge of €1.50 and a great series of frescoes by Ghirlandaio behind the altar. Also, the museum near the Chiostro Verde, outside the church to its left (follow the signs in the church), contains gently restored frescoes of Old Testament scenes by Paolo Uccello which are quite unusual in style and well worth seeing. Off of another cloister is the wonderful Spanish Chapel which is covered in huge, impressive 14th-century frescoes. Also don't miss the Cappella Strozzi di Mantova, up a flight of stairs at the end of the left transept, with dramatic frescoes of Heaven, Hell and Purgatory by Nardo di Cione. The gift shop is in the Sacristy, which also contains paintings and other artwork. Allotting 1 1/2-2 hours to see everything would be reasonable.
    crowd_level: null
    best_months: []
    source_ref: Florence > See > Old town centre
    crowd_evidence: []
    months_evidence: []
  - id: tuscany-florence-orsanmichele
