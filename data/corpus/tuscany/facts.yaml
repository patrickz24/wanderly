  - id: tuscany-florence-palazzo-vecchio
    name: Palazzo Vecchio
    kinds:
      - historic_site
    description: Old city palace/city hall, adorned with fine art. The replica of Michelangelo's "David" is placed outside the main door in the original location of the statue, which is a symbol of the Comune of Florence. The site displays an important collection of Renaissance sculptures and paintings, including the Putto by Verrochio and the series of murals by Giorgio Vasari at the Salone dei Cinquecento (Hall of the Five Hundreds) - the hall which used to display the now lost Renaissance masterpiece, that is, the so-called Battaglia di Anghiari, by Leonardo da Vinci.
