    description: Highlights are Michelangelo's original David (the one in Piazza della Signoria is a copy) and his unfinished Slaves. It also includes Florentine painting, a museum of musical instruments, and Russian icons. No photography is allowed inside. N.B. the "Accademia di Belle Arti" next door is a university department, not connected with the Gallery.
