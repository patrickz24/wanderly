  - id: tuscany-florence-galleria-degli-uffizi
    name: Galleria degli Uffizi
    kinds:
      - museum
      - food
      - family
    description: 'Outstanding fine art museum with Renaissance paintings and sculptures from classical antiquity. It''s in a late 16th-century palazzo designed by Vasari, in two wings enclosing a long narrow courtyard, effectively a street, an innovation in its day. Originally the palazzo was magistrates'' offices (hence "Uffizi") and state archives; then it came to house the Medici''s vast art collection. However, one collections seems to have crossed purposes: the massive number of standardized portraits, placed in the hallway, seem to have been an ID system for identifying important foreigners when they came to town. The artworks are on the first and second floors, they keep the lifts well hidden. Highlights include Birth of Venus by Boticelli, Dukes of Urbino by della Francesca, Medusa by Caravaggio, Venus of Urbino by Titian, Annunciation by da Vinci, Pope Leo X and family by Raphael, Velasquez'' self-portrait, Rembrandt''s final self-portrait, and many other big names. Allow three hours for a visit. Uffizi specialises in the Renaissance, so although later styles are represented, examples are few: you don''t really come here for the 18th- to 20th-century material. The restaurant/cafè has a large balcony overlooking the main piazza with good views of the Palazzo Vecchio, and naturally their prices reflect the views.'
    crowd_level: null
    best_months: []
    source_ref: Florence > See > Museums
    crowd_evidence: []
    months_evidence: []
  - id: tuscany-florence-bargello
    name: Bargello
    kinds:
      - museum
    description: Used as a barracks and prison until the 19th century, this museum houses some of the best Renaissance and Mannerist sculpture. Big names here include Michelangelo, Donatello, Ammannati, Bandinelli, Andrea and Jacopo Sansovino, Desiderio da Settignano, Giambologna, and Antonio Rossellino. It also displays ceramics, textiles & tapestries, ivory, silver, armour and coins. Allow two hours. Not nearly as crowded as the Uffizi or Galleria dell'Accademia and paying a fee to book in advance is likely not necessary.
    crowd_level: 2
    best_months: []
    source_ref: Florence > See > Museums
    crowd_evidence:
