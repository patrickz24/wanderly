  - id: tuscany-siena-palazzo-pubblico
    name: Palazzo Pubblico
    kinds:
      - museum
      - religious_site
      - viewpoint
    description: This striking structure has functioned as Siena's City Hall for almost 800 years and is probably the building that most recognizably represents Siena. It contains (among many other things) the famous frescoes on good and bad government by Ambrogio Lorenzetti, frescoes by Simone Martini and Duccio, and access to the Torre del Mangia, from the top of which you can view a beautiful panorama of the Sienese countryside. The frescoes on good and bad government and their effects on the city and surrounding countryside (painted 1338-1339), probably Ambrogio Lorenzetti's greatest masterpieces, are in the Sala dei Nove, where the Council of Nine who ruled the city state in the early 14th century could see them and, it was hoped, would keep them close to mind while making important decisions. These frescoes and Duccio's Maestà in the Museo dell'Opera del Duomo are the most important paintings in Siena and for many people represent highlights of a visit to this city, but there are many other beautiful things to see in the Palazzo Pubblico, so allow some time (preferably a couple of hours) to view them all. This building's exterior is equally beautiful and includes a lovely marble chapel, the Cappella di Piazza, which is at the foot of the Torre di Mangia. Built in 1352, it is dedicated to the Virgin Mary, as was the entire city after it avoided annihilation in the devastating black plague of 1348.
    crowd_level: null
    best_months: []
    source_ref: Siena > See > Piazza del Campo
