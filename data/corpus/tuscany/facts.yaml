  - id: tuscany-siena-palio-horse-race
    name: Palio Horse Race
    kinds:
      - family
    description: A horse race like nowhere else, between the 17 contrade of Siena, is run in the Piazza del Campo on July 2 and August 16. All Sienese are affiliated with one of the contrade, to which a typical Sienese feels loyal with a strength perhaps surpassed only by their loyalty to their family. Since the 11th century, the Sienese have conducted festivals every year in which the contrade compete for renown (and in times gone by, actual political power) through contests such as flag throwing, horse racing and even fist fights. The fist fights no longer happen (a heavy police presence in the weeks prior to the contest sees to that), but the spirit of competition between contrade is still fierce. The race is held in late evening but the whole day of the race is taken up with processions through the streets of the various contrade competing in the particular race (only ten can compete at any time for safety reasons).
