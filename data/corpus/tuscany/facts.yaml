  - id: tuscany-the-national-park-of-the-tuscan-archipelago
    name: The National Park of the Tuscan Archipelago
    kinds:
      - beach
      - nature
    description: the Park was established in 1996 and it covers an area of over 18,000 hectares in addition to 40,000 hectares of sea. It is managed by an organization with the same name, that has its headquarters in Portoferraio (on Elba Island). The Park falls under the jurisdiction of the Province of Livorno and that of Grosseto.
    crowd_level: null
    best_months: []
    source_ref: See > Parks
  - id: tuscany-the-national-park-of-the-foreste-casentinesi-monte-falterona-and-campigna
    name: The National Park of the Foreste Casentinesi, Monte Falterona and Campigna
    kinds:
      - nature
    description: 'Following the Arno upstream you enter the district of Casentino surrounded by mountains to the north and the east. Here the National Park of the Foreste Casentinesi, Monte Falterona and Campigna offers a uniquely moving and unforgettable experience: that of discovering one of the oldest forests in Europe.'
    crowd_level: null
    best_months: []
    source_ref: See > Parks
  - id: tuscany-the-maremma-regional-park
    name: The Maremma Regional Park
    kinds:
      - beach
      - nature
    description: the Maremma Regional Park (Parco Regionale della Maremma), also known as Uccellina Park (Parco dell’Uccellina) covers a coastal area between Principina a Mare and Talamone near Grosseto, Magliano in Toscana and Orbetello, right up to the Livorno – Rome train line.
    crowd_level: null
    best_months: []
    source_ref: See > Parks
  - id: tuscany-the-park-of-migliarino-san-rossore-and-massaciuccoli
    name: The Park of Migliarino, San Rossore and Massaciuccoli
    kinds:
      - beach
      - nature
    description: 'the Park of Migliarino, San Rossore and Massaciuccoli was established in 1975 and covers 24,000 hectares between Pisa, Viareggio, San Giuliano Terme, Vecchiano and Massarossa. What makes this park so special is what lies around its borders: the Tirrenian Sea, Lake Massaciuccoli and the rivers Arno, Serchio, Canale dei Navicelli and Morto e Burlamacca.'
    crowd_level: null
    best_months: []
    source_ref: See > Parks
  - id: tuscany-the-montioni-nature-park
    name: The Montioni nature park
    kinds:
      - nature
      - historic_site
    description: managed by the Municipale Administrations of Grosseto and Livorno. Park status from 1998. The park extends over 7000 hectares and rises to 300m at Poggio al Checco, its highest point. The territory has a large artistic and culture heritage, from ancient archeological finds to Etruscan and Roman remains which have been found under medieval constructions such as the Pievaccia, the ruins of Montioni Vecchio Castle and Montioni Thermal Baths.
    crowd_level: null
    best_months: []
    source_ref: See > Parks
  - id: tuscany-the-livorno-hills-park
    name: The Livorno Hills Park
    kinds:
      - nature
      - historic_site
    description: The Livorno Hills Park encompasses a vast area between the districts of Livorno, Collesalvetti and Rosignano Marittimo. Its nickname is ‘the lost island’ due to the fact that this stretch of land was an island until it attached itself to the mainland thousands of years ago. The park has not only areas of outstanding natural beauty but also but has also been subject to interesting archeological, artistic and cultural discoveries.
    crowd_level: null
    best_months: []
    source_ref: See > Parks
  - id: tuscany-the-archaeological-park-of-poggibonsi
    name: The Archaeological Park of Poggibonsi
    kinds:
      - nature
      - historic_site
    description: the visit starts with a short documentary film that illustrates the results of twelve years of excavation and the most important archaeological, architectonical and naturalistic aspects of the Poggio Imperiale site.
    crowd_level: null
    best_months: []
    source_ref: See > Parks
  - id: tuscany-the-parks-of-the-val-di-cornia
    name: The Parks of the Val di Cornia
    kinds:
      - nature
      - historic_site
      - museum
    description: the Parks of the Val di Cornia, in Tuscany, tell a thousand-year-old story which begins with the Etruscan people and bears witness to centuries of extraction and working on metals, proposing also splendid natural, coastal and hilly environments. The system includes 2 Archaeological Parks, Natural Parks, 3 Museums, 1 Documentation Centre, included in the area of the five municipalities at the extreme south of the province of Livorno, opposite the Island of Elba.
    crowd_level: null
