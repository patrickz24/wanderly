  - id: tuscany-siena-duomo-di-siena
    name: Duomo di Siena
    kinds:
      - beach
      - museum
      - religious_site
    description: Siena's magnificent black and white Italian Romanesque cathedral includes the Libreria Piccolomini, with splendid frescoes by Pinturicchio, the lovely Baptistery (separate entrance and charge), and an attached museum (separate entrance and charge, see below). Also marvel at the inlaid floors; even as they are sometimes covered for protection, a section is always left visible. At the height of Siena's power it was decided to enlarge the cathedral so that the existing Duomo would become merely its transept; the money ran out very soon after one of the new outer walls, which is still standing as a reminder of the grandiose undertaking, was completed. It is possible to see all of this in one day, but expect it to take at least the better part of an afternoon.
