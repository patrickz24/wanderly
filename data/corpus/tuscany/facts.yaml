  - id: tuscany-the-national-park-of-the-tusco-emilian-apennines
    name: The National Park of the Tusco-Emilian Apennines
    kinds:
      - nature
    description: extends lengthwise for about 60 km from the high valleys of the mountain torrents of Parma and Baganza up to the Passo delle Forbici, opening up to include on the Tuscan side the calcareous massif of the Pania di Corfino, and in Emilia the chain of the Alps of Succiso, of Monte Cusna, the valley of the river Secchia and the isolated range of the Pietra di Bismantova.
    crowd_level: null
    best_months: []
