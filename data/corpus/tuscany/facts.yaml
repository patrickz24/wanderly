  - id: tuscany-florence-museo-galileo
    name: Museo Galileo
    kinds:
      - museum
    description: This museum shows the evolution of the instruments used in various scientific fields such as mathematics, physics, biology, chemistry, astronomy. The room of Galileo Galilei shows some of his original instruments as well as models from his drawings. The room of Spheres and Globes houses an excellent cartographic collection. In a rather macabre twist the museum also has the middle finger of Galileo's right hand on display. The museum offer some descriptions in Italian and English but you can access other languages by scanning QR codes (Chinese, French, Japanese, Portuguese, Russian, Spanish, German). The museum offers an open WiFi. It is recommended to have an idea of the principles behind the instruments (as the descriptions on the labels are rather generic). For that, you can download their free audio-guide app available in Italian and English (Google Play, Apple Store) and get an idea of the instruments displayed.
