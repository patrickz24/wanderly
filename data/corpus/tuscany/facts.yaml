    description: '* Pinocchio’s Park is in Collodi, lovely ancient village that has remained virtually unchanged since the last century. Its charming collection of houses, nestled among the hills, leads the way to Villa Garzoni and its lovely 19th century garden, often considered among the most beautiful in Europe.'
