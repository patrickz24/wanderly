    description: "The Calanques. The Calanques are a series of miniature fjords to the south of Marseille near Cassis. From Marseille these are best accessed from the University campus at Luminy which can be reached by bus #21 departing from Rond Point du Prado opposite the Stade Velodrome or from Vieux Port. The 'fjords' are amazing with wonderful blue sea and spectacular lime stone cliffs. The walk along the coast from Cassis to Marseille is spectacular, it can be done in one day at a fast pace. The trail (GR) is clearly marked (red and white strips). From Luminy, you can turn left to Cassis or right to Callelongue (bus #20 connects you to bus #19, which takes you to Rond-Point du Prado for connections to the centre, or you can use also bus #21, 23). From June to September some of the Calanques can be closed due to high risk of fire. Since 2022, in order to preserve the National Park from erosion due to the large number of visitors, it is now mandatory to make a free reservation to visit Pierres Tombées and Sugiton's calanques during the summer."
