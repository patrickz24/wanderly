  - id: provence-avignon-theatre-festival
    name: Theatre Festival
    kinds:
      - historic_site
    description: Avignon is famous the world over for its annual theatre festival. For three or four weeks in July the city is virtually swollen with street performers, actors, musicians, and of course the ubiquitous tourists. The festival is an excuse to turn any room with enough seating into a 'salle de spectacle' and the city is host to a wide variety of entertainment. The gem of this festival are the performances which take place inside the Pope's Palace itself. Tickets are expensive, but this is considered by many French and European thespians to be a crowning achievement of their career. The vast majority of performances are, of course, in French but a number of foreign companies perform in other languages including English. Even without attending any events, the atmosphere and street theatre give the city a marvellous feeling.
