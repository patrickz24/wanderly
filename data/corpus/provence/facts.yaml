  - id: provence-avignon-papal-palace
    name: Papal Palace
    kinds:
      - historic_site
    description: This is the palace where the Popes of Avignon ruled. For part of the period the Papacy was divided, with a Pope in Rome and another in Avignon. Most of the artwork inside (statues, frescoes) was destroyed during the French Revolution, but the impressive building still stands, and little bits of artwork, such as those that were too high to be convenient to ruin, remain.
