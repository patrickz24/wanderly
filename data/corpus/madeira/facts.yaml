    source_ref: Porto da Cruz > Do > Hikes
    crowd_evidence: []
    months_evidence: []
  - id: madeira-porto-da-cruz-levada-do-castelejo
    name: Levada do Castelejo
    kinds:
      - hiking
      - nature
    description: This levada hike takes you into the mountains and lush pine and native laurel forest, past waterfalls, to the Ribiero Frio (Cold River)—one of the most important sources of water for the north of Madeira, including this levada's source. To find the trailhead, take any of the main roads from the center of Porto da Cruz, uphill (about 40 minutes hiking, or 10 minutes driving). At the blue bar, there's a sign pointing the way. When this road forks, take the right (dry levada) fork a few hundred metres until you see the well-marked trailhead and map. From here it's an easy and tranquil 8.6-km round-trip hike with virtually no elevation change. At the opposite terminus the trail ends at a huge boulder and the Ribeiro Frio.
    crowd_level: 2
    best_months: []
    source_ref: Porto da Cruz > Do > Hikes
    crowd_evidence:
      - From here it's an easy and tranquil 8.6-km round-trip hike with virtually no elevation change.
    months_evidence: []
  - id: madeira-porto-da-cruz-vereda-da-penha-daguia
    name: Vereda da Penha d'Aguia
    kinds:
      - hiking
      - village
    description: 'This strenuous hike takes you to the 590-metre-high massif overlooking the sea and village. To find the trailhead, take any of the main roads from the centre of Porto da Cruz, uphill (about 40 minutes hiking, or 10 minutes driving). Just before the blue bar, a blue and white "Verada da Penha d''Aguia" sign will point to a levada threading between houses; follow this for 100 m until another sign (whose back is facing you) points to a left-turn away from the levada and up a steep, windy trail. After 40–60 minutes the trail forks: turn right to overlook Porto da Cruz, or turn left to overlook São Roque do Faial.'
