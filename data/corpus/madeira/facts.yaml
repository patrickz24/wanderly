  - id: madeira-funchal-quinta-do-palheiro-ferreiro-park
    name: Quinta do Palheiro Ferreiro Park
    kinds:
      - nature
      - food
    description: "The Quinta do Palheiro Ferreiro Park is a typical example of a manor in British colonial style. While the manor is private and can't be visited, you can enjoy the public park. On first sight it looks like an English park, with old Platanes forming a long alley from the main gate to the gardens. But when you look closer you see all the tropical plants that build the basis, completed by hundreds of plants from all over the world, so all year round there are plants blooming. The main part of the park is formed by several gardens: a French Garden, a Sunken Garden, the Ladies Garden, a Rose Garden and some more. Opposite the main gate is a Tea House, which is connected to the golf course. They serve some good tea, cakes, pastries, snacks and small lunches. The way back to the main gate is formed by the Camellia Avenue, a flourish firework between end October and March. The park is at 500 m altitude. 09:00-11:30 the park is often crowded by bus tourists, so choose the afternoon for a more laid-back visit. Entrance fee €10.50. Public buses frequently connect Funchal with the park: line 36 or, if you have strong nerves, line 37 for a more spectacular ride."
    crowd_level: 4
    best_months: []
    source_ref: Funchal > See
    crowd_evidence:
