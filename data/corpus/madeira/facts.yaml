  - id: madeira-funchal-mercado-dos-lavradores
    name: Mercado Dos Lavradores
    kinds:
      - historic_site
      - boat_trip
      - nightlife
    description: This historic building, with an open patio, offers, on two levels, fresh fruits and vegetables from all over the island. On the lower level is a separate hall where fish vendors sell fresh-caught fish. Eat and buy local fruits like the small Madeiran mangos, bananas, philodendres and plenty of kinds of maracujas. Taste the offers from vendors. But be careful, as some may try to rip you off and sell you over-ripe fruit, or some heavy mangos for the (expensive) price of light maracujas. There are also some nice pastelarias and coffee bars in and around the building. These are often crowded when it's raining, and when large cruise ships are on the pier.
    crowd_level: 4
