    name: Vereda do Larano
    kinds:
      - hiking
      - viewpoint
    description: 'This hike connects Machico and Porto da Cruz along the north coast. From Machico, it begins with the Levada do Caniçal and goes via the Boca do Risco viewpoint. Bus routes or your car can take you back, or some tour companies offer this. Be safe: have a map and a buddy. 12 km one-way.'
