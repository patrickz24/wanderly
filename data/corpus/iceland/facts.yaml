      - family
    description: A brand new complex on the outskirts of the city, it has nice views over the city centre and is a nice place to watch the sunset. There is an indoor and outdoor pool, a waterslide, several hot-pots and a steam bath. This is a favourite with families and is perhaps the nicest of the city's pools. Buses run here from central Reykjavik.
