  - id: iceland-reykjavik-laugardalslaug
    name: Laugardalslaug
    kinds:
      - beach
      - nature
    description: The city's largest pool with extensive facilities, in Laugardalur Valley east of the city centre. It has two large pools for swimming, several hot-pots, a seawater bath, a steam bath, and water slide. It is a well-used large complex that is starting to show its age a little but it is still the best option in the city. It is undergoing quite a lot of renovation work, but the pool remains open.
