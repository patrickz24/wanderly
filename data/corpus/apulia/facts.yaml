  - id: apulia-tremiti-islands-grotta-del-bue-marino
    name: Grotta del Bue Marino
    kinds:
      - beach
      - nature
    description: The cave owes its name to monk seals (almost totally extinct in the Mediterranean by now) that in old times inhabited the area, and until a few decades ago wallowed in the waters of the archipelago. It is 70 m long, but only 2 m deep, and has a tiny sandy beach in the back. Due to the shallow depth of the sea in this point, the sunlight gets across the water giving a turquoise colour to the whole space. It sits at the foot of the Ripa dei Falconi, where the legendary birds, the Diomedea, are said to nest. On its ceiling are found the oldest rocks of the islands, dolomitic limestone of fossil origin. As you enter the cave, the light gradually decreases until it is totally devoid of light in the innermost part. Furthermore, the innermost part of the cave divides into two branches, one of which overlooks a small beach.
