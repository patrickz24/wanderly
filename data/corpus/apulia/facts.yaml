    description: 'The Sanctuary of Santa Maria a Mare is a Catholic Church, which was also a monastery and an abbey through the centuries. The impressive and majestic Abbey of Santa Maria was built, according to historical data, in the 9th century by the Benedictine monks of Monte Cassino, later renovated in 1045, until, following the invasion of Dalmatian corsairs, despite the fortress being surrounded by walls and fortifications, it was sacked in 1334, where the monks were killed. According to mythology, the abbey was built by the hermit San Nicola, to whom, it seems, the Madonna appeared requesting him the construction of a sanctuary. In any case, the abbey of San Nicola became a real fortress, which over the centuries has also suffered numerous other attacks and invasions, until, in 1700, King Ferdinand IV of Naples transformed it into a penal colony, making it also a theatre of naval battles (in fact it is still possible to notice the presence of cannon holes). In the Fascist period it was used to imprison political and homosexual prisoners. Later, the façade and the portal were modified through the addiction of some decorative patterns in Renaissance style. These modifications were commissioned by the Canons Regular of the Lateran. On the portal there are delicate reliefs portraying the Virgin Mary with Saints and Cherubim. The church''s interior retains its original structure intact: it has a rectangular plan with three naves and a double deambulatory. Special attention should be paid to the works of art present in this church, such as: the wooden cross, with a particular shape, typical of Greek-Byzantine iconography; the wooden statue "S. Maria a Mare", that represents the Virgin and Child; the Wooden Polyptych on the main altar, a gold laminated carving; the mosaic floor that, after several restorations, can now be admired on the central nave, and that probably is the most significant piece in the Church. The cloister of the monastery is also worth mentioning: the first cloister (the most ancient one) has an 18th-century well in the middle, with water coming from a big underground cistern.'
