  - id: apulia-bari-chiesa-di-santanna
    name: Chiesa di Sant’Anna
    kinds:
      - historic_site
      - museum
      - religious_site
    description: 'St. Anna Church was built between 1246-1247 as a synagogue, known as “Scola Grande”. It was later converted into a Christian Church and entrusted to the Confraternity of St. Anna. Finally, in 2009, the Church became a museum. Its history is rooted to ancient times, when there was a significant Jewish community in Apulia, mostly composed of traders and farmers. During the early Middle Ages, the Jewish culture experienced an intense growth and several Talmudic schools were established in Apulia. Rabbenu Tam considered them to be very prestigious institutions, declaring that: “For out of Bari goes forth the Law and the word of the Lord from Otranto". In the 11th century Apulia fell under the rule of the Normans and, after a couple of centuries, to the Swabians, with Frederick II, also known as "Stupor Mundi" (“Wonder of the World”), who protected the Jewish community and gave Jews rights by reason of their presence in politics and their personal history. The Angioinians, instead, ordered the forced conversion of most Jews to Catholicism and, when Naples and part of Southern Italy fell to the Spanish in 1510, the Jewish community was completely expelled. The church is located in the local Giudecca and is also close to the city harbour and the Cathedral.'
    crowd_level: null
    best_months: []
    source_ref: Bari > See
    crowd_evidence: []
    months_evidence: []
