    description: In the middle of the bay there are two islands, Sveti Djordje (St. George Island) and Gospa od Skrpijela (Our Lady of the Rocks), which are worth seeing and accessible by tourist boats (€15), which leave from outside the old town main gate. It is however much cheaper to first go by bus to Perast (€1) and then use a water taxi (€5) to get to the islands.
