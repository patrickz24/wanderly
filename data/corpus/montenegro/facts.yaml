  - id: montenegro-kotor-climb-up-inside-the-fortress
    name: Climb up inside the Fortress
    kinds:
      - hiking
      - nature
      - historic_site
      - adventure
    description: The fortifications are some 4.5 km away, directly above the walled city, on almost vertical cliffs. Upon reaching the fortress, you will be rewarded with a view of Kotor and the bay. Entry is advisable only for relatively physically fit people. Pay to use one of several entrances in the old city (near either the north or south gates) to climb up the 1,350 steps along switchbacks. The path is in relatively good shape, although some of the steps are broken. This 365-m ascent may take 30 minutes to 1 hour, depending on your physical capabilities. Ticket gate hours are until 20:00 (earlier in shoulder or off season). They are very strict about the ticket policy. Everyone will be checked, and you must return your ticket stub at a small table upon leaving. If you cannot show a ticket stub or receipt as proof, you will be charged the full price a second time.
    crowd_level: null
    best_months: []
    source_ref: Kotor > Do > Hiking
  - id: montenegro-kotor-climb-up-outside-the-fortress
    name: Climb up outside the Fortress
    kinds:
      - hiking
      - nature
      - historic_site
      - religious_site
      - adventure
    description: Alternatively, if you wish to skip the €15 and still be rewarded with a similar view, there is a trail behind the old power station, outside the city near the north gate, which runs parallel northeast of the fortifications. To find this trail (see GPS for starting point), exit the old walled city through the north gate, cross the bridge, and continue until the intersection with the main road. Then, make a right turn at the main road and continue walking until you see a small path to the left of the house at the top of the road. Then, take this small path that becomes a trail behind the abandoned power station. The easiest way to navigate this trail is using OsmAnd or Google Maps. After you have reached the cafe that is partially up the mountain using this trail, you can turn right onto a path behind that cafe that will take you to the small abandoned Church of St. George. When you reach the church, look west towards the old city of Kotor to see a small opening (large window) in the fortifications, often with a small ladder. The opening would give you free entrance to the fortifications, but it was closed in July 2023. Nevertheless, it doesn't hurt checking while you are up there. This path is more strenuous than the paid option, and takes longer, so be prepared and bring plenty of water, but you will be rewarded with two cafés up there. The window to the fortress is not closed as of June 2025.
    crowd_level: null
    best_months: []
    source_ref: Kotor > Do > Hiking
