      - food
    description: This is a full-day hike continuing further outside of the fortification, passing a zip-line, a nice little restaurant half-way, and into Lovćen National Park. Just 13 km, but from 0 m to 1,700 m of elevation.
    crowd_level: null
    best_months: []
    source_ref: Kotor > Do > Hiking
