    description: This is small single nave church whose dimensions are 5 x 3 m. It is supposed to have been built during the 14 century. During the Venetian and Austrian occupations the most valuable possessions of this church disappeared. Today there is almost no trace of decorations with icons, frescoes or sculptures. It is not operating.
