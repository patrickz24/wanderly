      - religious_site
    description: Seat of the Budva bishopric till 1828. In 1867 the belfry was added to the north side of the church and it still exists. Among preserved monuments the most important ones are the icon “Madonna in Punta” and the rich archives and library. Among its holdings is the Chronicle of Budva most comprehensive source of data and events in Budva between 1796 and 1842. Operating church.
