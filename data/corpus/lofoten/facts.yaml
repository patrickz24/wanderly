      - boat_trip
    description: a fjord so narrow that the Hurtigrute boats, except for the very newest, have to do a three point turn. Navigation banned in spring because of falling rock, but otherwise visited on the southbound voyage of the Hurtigruten. Alternatively reached by a boat trip from Svolvær.
