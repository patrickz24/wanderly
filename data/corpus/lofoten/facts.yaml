pois:
  - id: lofoten-moskstraumen
    name: Moskstraumen
    kinds:
      - other
    description: The Moskstraumen, popularly known as the Maelstrom is a very powerful tidal current forming twice a day between Vaeroy and Meskenesoy. It has been featured in many works, usually in an exaggerated form (for instance Edgar Allan Poe's Descent into the Maelstrom). Captain Ahab in Hermann Melville's famous Moby-Dick mentions the maelstrom. In Jules Verne's Twenty Thousand Leagues Under the Sea the submarine encounters the whirlpool. It is unusual because it occurs in open sea. Simply do not go there and expect giant whirlpools...
    crowd_level: null
    best_months: []
