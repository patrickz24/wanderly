  - id: algarve-faro-faro-jewish-heritage-centre
    name: Faro Jewish Heritage Centre
    kinds:
      - museum
      - religious_site
      - family
    description: Established in 1851, the Faro Jewish Cemetery is the only remaining vestige of the first post-Inquisition Jewish presence in Portugal. It served as a burial place for a thriving 60 family community (also known as "Little Jerusalem"). The Jews of Portugal were expelled by the Inquisition at the end of the 15th century and settled in Gibraltar and North Africa. After the devastating 1755 Lisbon Earthquake, their descendants were invited by the Marquis of Pombal to help rebuild the economy. Although the community is long gone, the cemetery remains to remind citizens and travellers of its former glory. The Faro Jewish Heritage Centre features over one hundred graves in Sephardi style, with beautifully engraved slabs instead of headstones. Although the land was purchased by the Jewish community in 1851, the first burial, that of Rabbi Toledano, dates back to 1838. Apart from the Cemetery, there is also a museum, housing many objects linked to the history of the Jews of Faro, like the furniture from one of the two former synagogues of Faro or the facsimile copy of Gacon's 1478 Pentateuch in Hebrew, the first book ever printed in Portugal!
    crowd_level: null
    best_months: []
    source_ref: Faro > Do
    crowd_evidence: []
    months_evidence: []
