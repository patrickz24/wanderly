      - adventure
    description: 6,000-m² area, a great place to swim, also has two waterslides, a trampoline, a climbing wall, four outdoor swimming pools, a jump board as well as climbers, swings and a sandbox for children, table tennis, chess, 1,000 changing rooms, 107 lockers, boat rental, snack shop, and a grassy beach.
