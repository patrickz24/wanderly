    description: A self-declared autonomous culture place to gather for alternative artists, many subcultures and youth. What used to be a military barracks is now full of underground artists, bars and nightclubs. Metelkova can get crowded on Fridays and Saturdays. It is within 5 minute of walk from main Train Station, and it is home to a renowned hostel Celica.
