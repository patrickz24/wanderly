  - id: slovenia-adrenaline-adventures
    name: Adrenaline adventures
    kinds:
      - nature
      - adventure
    description: Adrenaline adventures in the Posočje area, you can stay in Ljubljana and, in a short distance away, discover the amazing North-Western area of Slovenia called Posočje and Triglav National Park—canyoning (soteskanje), rafting and para-gliding are available. Because of the relatively new appearance of Slovenia on the national stage of extreme sports, these are much less expensive to participate in than other European countries, such as the UK or Switzerland. These activities are particularly prevalent in Bohinj, Bovec, Kranjska Gora, and other north-western cities.
    crowd_level: null
    best_months: []
    source_ref: Slovenia > Do
  - id: slovenia-bled-lake-bled
    name: Lake Bled
    kinds:
      - nature
    description: Formed after the recession of the Bohinj glacier at the end of the Ice Age. As much as 2120 m long and 1380 m wide. Maximum depth is 30.6 m. With no natural tributaries, it is fed by a few springs.
    crowd_level: null
    best_months: []
    source_ref: Bled > See
  - id: slovenia-bled-bled-castle
    name: Bled Castle
    kinds:
      - nature
      - historic_site
      - museum
      - religious_site
      - wine
    description: A picturesque white and red castle enclosed by a Romanesque wall with parapets, ramparts, and towers. The current incarnation of the castle dates from the 17th century and was restored in the 1950s. The upper courtyard includes a 16th-century chapel decorated with frescoes from 1700 and includes a painting of Henry II conferring Bled to Bishop Albuin. There is a small museum with an exhibition on the castle's history and the usual array of medieval pomp, pageantry and weaponry. However, the items do not include descriptions in any language. The castle terrace offers great views of the lake and island below. There is also a small wine center run by Andre, the monk. There, for the price of a champagne bottle (€15) Andre will teach you how to perform Sabrage, or Sabree, the art of cutting the top of the bottle off with a blade. You can also bottle, label, and wax stamp your own wine right in the cellar with Andre. The wooden steps near the wine cellar lead to small shop that sells various herbs and oils. Go in here for the smell.
    crowd_level: null
    best_months: []
    source_ref: Bled > See
  - id: slovenia-bled-bled-island
    name: Bled Island
    kinds:
      - religious_site
    description: Excavations on the island have revealed the remains of a pre-Romanesque Chapel and a large Slavic cemetery dating to 9 AD.
    crowd_level: null
    best_months: []
    source_ref: Bled > See
  - id: slovenia-bled-church-of-the-assumption
    name: Church of the Assumption
    kinds:
      - religious_site
    description: The present baroque church dates from 1698. Well preserved frescoes depict scenes from the life of Virgin Mary. Ring the wishing bell, which was installed in the original Gothic church in 1534. The Provost's house and the smaller building behind the church were used as guesthouses. According to local tradition, a husband who can carry his newly married bride the 99 steps up from the dock into the church will be ensured a happy marriage, and ringing the bell in the church will fulfill one of your wishes.
    crowd_level: null
    best_months: []
    source_ref: Bled > See
  - id: slovenia-bled-iglica-waterfall
    name: Iglica Waterfall
    kinds:
      - nature
      - adventure
    description: 18 m high, but very narrow waterfall over a vertical wall of Permian limestone. Popular for rock climbing. If you go up the stairs you have a beautiful view over the whole area.
    crowd_level: null
    best_months: []
    source_ref: Bled > See
  - id: slovenia-bled-babji-zob-hags-tooth-caves
    name: Babji Zob (Hag's Tooth) Caves
    kinds:
      - nature
    description: 300-m cave system includes rare helictites (calcium deposits) and a tooth-shaped pillar atop a 1128-m peak. Very different than other caves in Slovenia. Three-hour tours take place Wednesdays, Saturdays, and Sundays in the summer. Meet at Bohinjska Bela 34.
    crowd_level: null
    best_months: []
    source_ref: Bled > See
  - id: slovenia-bled-houraway
    name: HourAway
    kinds:
      - hiking
      - adventure
    description: Houraway specializes in bespoke outdoor experiences, offering both multi-day and day tours tailored to your preferences. Whether you’re interested in cycling or hiking, their guided and self-guided options cater to all fitness levels and interests. Houraway also provides high-performance e-bikes and gravel bikes for rent, perfect for exploring Slovenia’s stunning landscapes. Their knowledgeable team is always ready to help with route suggestions and insider tips, ensuring a memorable adventure in the wider Bled and Ljubljana areas.
    crowd_level: null
    best_months: []
    source_ref: Bled > Do
  - id: slovenia-bled-altitude-activities
    name: Altitude Activities
    kinds:
      - hiking
      - nature
      - adventure
    description: Friendly outdoor agency run by twin brothers, who are outdoor enthusiasts. There you can go on guided tours for activities like paragliding, skydiving, hiking, mountaineering, canyoning, kayaking, rafting, hot air ballooning, bike tours, rock climbing, via Ferrata and day tours around Triglav national park. If you need any information about hiking, they are happy to help and give you information. There you can also rent bikes and equipment for climbing.
    crowd_level: null
    best_months: []
    source_ref: Bled > Do
  - id: slovenia-bled-hiking
    name: Hiking
    kinds:
      - hiking
      - beach
      - nature
    description: Bled offers several easy to moderate hikes, many of which offer amazing picturesque views of the island. Velika Osojnica, a 756m high peak at the southwestern corner of the lake offers the best and most famous views of Bled, and is popular among photographers. An easier, but less spectacular option is to hike up 638m Straza, covered with linden oak and spruce trees, southwest of the Grand Hotel Toplice.
    crowd_level: null
    best_months: []
    source_ref: Bled > Do
  - id: slovenia-bled-swimming-at-grajsko-kopalisce-castle-bathing-area
    name: Swimming at Grajsko kopališče (Castle Bathing Area)
    kinds:
