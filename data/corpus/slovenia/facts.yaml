  - id: slovenia-ljubljana-triple-bridge
    name: Triple Bridge
    kinds:
      - other
    description: "The central span is from 1842: it became a bottleneck so in the 1930s footbridges were added on each side, fanning out slightly. On the north bank these lead into Prešeren Square, adorned by the statue of the national poet France Prešeren (1800-1849). It's the obvious rendezvous point in town; the area is pedestrianised. The TIC is south end of the bridge."
    crowd_level: null
    best_months: []
    source_ref: Ljubljana > See
  - id: slovenia-ljubljana-old-town
    name: Old Town
    kinds:
      - historic_site
      - food
    description: The old town has two squares, Mestni trg (City square) with the Robba fountain and the city hall behind it, and, further on, Gornji trg (Upper square). Well preserved medieval buildings now house local designer shops, and several popular cafes and restaurants. Although they may look creepy, the perfectly safe narrow lanes lead to charming little squares and buildings.
    crowd_level: null
    best_months: []
    source_ref: Ljubljana > See
  - id: slovenia-ljubljana-dragon-bridge
    name: Dragon Bridge
    kinds:
      - food
    description: Completed in 1901, designed by Croatian Jurij Zainovich. It is guarded by four detailed dragon statues from the city's coat-of-arms. Look out for the dragon motif throughout the city. Be careful around the Dragon Bridge area, as it is on a major busy road just outside the pedestrian zone and near misses (and worse) between inattentive tourists and traffic are common. The dragon bridge is located at the end of the Ljubljana Open Market, just a block or two down the river (north-east direction) from the Triple bridge.
    crowd_level: null
    best_months: []
    source_ref: Ljubljana > See
  - id: slovenia-ljubljana-ljubljana-castle
    name: Ljubljana Castle
    kinds:
      - historic_site
    description: The tower has magnificent views all over the city. You can also see the Sava River and Kamnik Alps in the distance. Included is a 3D Movie of the history of Ljubljana from a pre-historic settlement to Roman Empire to modern times (€6.50 for adults, €3 for students, seniors).
    crowd_level: null
    best_months: []
    source_ref: Ljubljana > See
  - id: slovenia-ljubljana-republic-square
    name: Republic Square
    kinds:
      - other
    description: Where crowds gathered as Slovenia announced its independence from the Yugoslav Federation in 1991. The square has significant importance for Slovene history, as it was a place of important public gatherings (and demonstrations) in the past. Across the road is the Slovene Parliament. Its façade is decorated with artistic nude statues of Slovenes at work and leisure. The square also houses the International Business Centre.
    crowd_level: null
    best_months: []
    source_ref: Ljubljana > See
  - id: slovenia-ljubljana-roman-ruins
    name: Roman Ruins
