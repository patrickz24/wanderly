pois:
  - id: hvar-town-square
    name: Town Square
    kinds:
      - hiking
      - historic_site
    description: The Town Square in Hvar is among the most beautiful and the largest in Croatia. The square measures 4500 m², and the town has developed around this square, starting north of the square in the 13th century and then circling to the south of the square in the 15th century. There is also a fortress at the top of the hill with walls that encompass parts of the city. It's an easy walk, although uphill, to the fortress. It's worth the trek however because of the wonderful views you have of the harbor and surrounding areas. Don't forget to bring your cameras. There is a small eatery in the middle of the fortress where you can purchase drinks and snacks.
    crowd_level: null
    best_months: []
    source_ref: See > Hvar (city) and surroundings
  - id: hvar-cathedral-of-st-stephen
    name: Cathedral of St. Stephen
    kinds:
      - historic_site
      - religious_site
    description: The Cathedral of St. Stephen (Trg Sveti Stjepana) dominates one end of the Town Square, and was built during the 16th and 17th centuries. The bell tower of this cathedral is four-stories high, with each level more elaborately decorated than the last. The cathedral was built over an existing cathedral that was destroyed by the Turks. Parts of this older cathedral can be seen inside the church, but most of the interior was rebuilt.
    crowd_level: null
    best_months: []
    source_ref: See > Hvar (city) and surroundings
  - id: hvar-bishops-treasury
    name: Bishop's Treasury
    kinds:
      - religious_site
    description: The Bishop's Treasury, adjacent to the cathedral, contains silver vessels, embroidered Mass robes, numerous Madonnas, icons dating from the 13th century, and an elaborately carved sarcophagus.
    crowd_level: null
    best_months: []
    source_ref: See > Hvar (city) and surroundings
