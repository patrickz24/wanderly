    description: 'Cargèse to Moriani-Plage. Suggested time: 11 days. This trail intersects with one of the Mare e Monti Trails. The trail is only lightly travelled from Corte to Moriani, as this is the less interesting half, with uniform scenery, and gîtes that may not be open unless you call first.'
    crowd_level: null
