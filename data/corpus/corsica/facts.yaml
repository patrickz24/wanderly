  - id: corsica-sartene-place-de-la-liberation
    name: Place de la Libération
    kinds:
      - historic_site
      - religious_site
      - food
    description: Formerly Place Porta (a very welcoming place where the inhabitants meet to discuss, mainly politics). There was the guillotine there. There the men of "good birth", the Sgios, argued. At the foot of the church, at dawn, the peasants were waiting for job offers. This shaded square, very lively with its market and cafes, faces southwest/northeast. It is dominated to the north by the town hall, the former governor's palace under Genoese occupation, and by Église Sainte-Marie, a characteristic Corsican church (with its three-level bell tower with bays and surmounted by a dome). At its southern end there is an esplanade, Pasquale Paoli square where the bust of the Babbu di a patria has been enthroned since 8 December 2006.
