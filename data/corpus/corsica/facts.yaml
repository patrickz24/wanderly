    kinds:
      - hiking
    description: perhaps the best known and most difficult of all the Grande Randonnée trails. This trail takes approximately 17 days if using the traditional waypoints, though it may take more or less time depending on your experience and needs. The trail is particularly crowded in August; many people suggest the best time is in late spring or early autumn. The greatest danger on the GR 20 arises from the intense summer storms, with lightning claiming the most fatalities.
