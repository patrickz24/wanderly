  - id: corsica-sartene-spin-a-cavallu-bridge
    name: Spin' a Cavallu bridge
    kinds:
      - historic_site
    description: This Pisan then Genoese bridge of the XIII and XV century over the Rizzanese is called A spin'a cavallu (literally "in the shape of a horse's back"). It would be the work of the architect Maestro Maternato. 64 m long and 2.60 m wide, it rises 8 m above the water and is one of the most famous bridges in Corsica, connecting the pièves of La Rocca and Sartène. It offers to admire a beautifully balanced architecture. Listed as a Historic Monument in 1992. Restored in 1995 after the floods of the Rizzanese and Fiumicicoli rivers, it is a typical Pisan bridge
    crowd_level: null
