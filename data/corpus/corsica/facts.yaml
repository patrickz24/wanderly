  - id: corsica-sartene-paddaghju
    name: Paddaghju
    kinds:
      - historic_site
      - museum
    description: The alignments are organized into seven groups, six oriented north-south and one east-west. All the menhirs are carved in the shape of a human silhouette (although none have clear minds), most being roughly rough-hewn. The three statue-stelae have swords engraved and two have daggers, other presumed engravings could be anatomical attributes. Funeral coffers have also been discovered. Only one is still preserved, partially inviolate, it contained furniture from the early Bronze Age which is now in the museum of Sartène. Aligned domes are visible on one of its uprights. Some authors see in them stellar representations or a motif linked to the cult of water, these domes perhaps allow rainwater to be collected with magical virtues. The menhirs were erected between 1900 and 1000 BC. The site was first listed in 1889 by Étienne Michon, who counted sixty to seventy menhirs there, divided into two groups. Giraux discovered another dozen in 1914. Roger Grosjean carried out various excavation campaigns from 1964 to 1968 and brought the number of discovered monoliths and three stele-statues to 255, which led him to qualify the site as a "laboratory of Corsican megalithism". The site is classified as a historic monument by order of 23 October 1974.
