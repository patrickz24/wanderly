  - id: corsica-bonifacio-eglise-sainte-marie-majeure
    name: Église Sainte-Marie-Majeure
    kinds:
      - beach
      - historic_site
      - religious_site
    description: This is the city's principal and oldest church, mostly Romanesque and probably built in the 12th century but much modified over time. It has a prominent bell-tower and three naves, with the central nave containing the relics of St Boniface. At the front, note the loggia, the covered walkway for medieval bigwigs to discuss city business. Beneath this is a large water cistern, fed from adjacent buildings by aqueduct-buttresses spanning the streets. In 1980 they tried to turn the cistern into a conference centre but, strange to say, it filled with water every time it rained.
    crowd_level: null
    best_months: []
    source_ref: Bonifacio > See
    crowd_evidence: []
    months_evidence: []
  - id: corsica-bonifacio-escalier-du-roi-daragon
    name: Escalier du Roi d'Aragon
    kinds:
      - nature
      - historic_site
      - religious_site
    description: From the SW edge of the citadel, 187 steps lead down the cliffs (their diagonal notch is very visible from the sea) to the Cave of St Barthelemy's Well. This cave, which nowadays can't be entered, has a pool of fresh(-ish) water percolated down from the limestone above, so it was an important water supply for the city. A well was also drilled down directly from near the church of St Barthelemy on the headland. The steps are named for Alfonso V, King of Aragon, who was awarded control of Bonifacio in 1421 by the Genoans but the city held out against him. Fanciful legend has his men fighting up the stairs and being beaten back, but more likely he simply tried to block the water supply to force the city's surrender. He was unsuccessful and left. Reserve on line to get your ticket.
    crowd_level: null
    best_months: []
    source_ref: Bonifacio > See
    crowd_evidence: []
    months_evidence: []
  - id: corsica-bonifacio-eglise-saint-dominique
    name: Église Saint-Dominique
    kinds:
      - historic_site
      - religious_site
    description: 'A rare example of Gothic style in Corsica, this church dates from the 13th century. The bell-tower is of no known style: it starts square, turns octagonal, then tops out in battlements. Occasional concerts are held in the church.'
    crowd_level: null
    best_months: []
    source_ref: Bonifacio > See
