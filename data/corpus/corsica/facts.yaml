    description: 'These menhirs were first described by Prosper Mérimée in his Notes d''un voyage en Corse, published in 1840. The place was then called I Stantari. In the section entitled "Menhirs of Rizzanesu", Mérimée describes her visit to the Friars is in Sora: "Two other menhirs, but aligned, are about a league from Sartène, on the left bank of the Rizzanesu and near the road to Propriano. The place it is called I Stantari. The two stones are inclined towards each other. The largest, three meters high, is a little wider at the bottom than at the top, it seems broken by chance. It is approximately square, the side measures about 0.85 m. The other stone, of the same size, does not exceed 1.60 m. The two menhirs are 0.50 m apart. Between the two standing menhirs there is a third, almost larger than the previous two, but resting on the ground.It could also be a fragment of one of the two menhirs.'
