    months_evidence: []
  - id: corsica-bonifacio-il-torrione
    name: Il Torrione
    kinds:
      - historic_site
    description: "The watchtower is the only citadel structure that remains from the original 9th-century Tuscan fortifications. It's been smashed down and rebuilt several times: the most recent destruction was in 1901 (as it gave enemy artillery too good a marker onto the town) and what you see now is a 1980 reconstruction."
    crowd_level: null
