    name: Senetosa lighthouse
    kinds:
      - other
    description: The Senetosa lighthouse was built behind the Corsican lighting schedule. It was designed by engineer Zevaco. Work began in 1889 and the lighthouse was lit on May 15, 1892 with a white light flashing every 5 seconds. Originally fueled by mineral oil, this fire switched fuel in 1906 to petroleum vapor. The lighthouse was later electrified and automated in 1988. It no longer has a keeper as of spring 2008. At the end of 2011, the Senetosa lighthouse was the first lighthouse to pass under the responsibility of the Conservatoire du littoral, as part of the transfer of the management of some sixty state lighthouses to the conservatory decided in 2011.
