    description: The tower is located at an altitude of 129 m on the Capu di Senetosa promontory. The tower was built in 1610. It was one of a series of coastal defenses built by the Republic of Genoa between 1530 and 1620 to stem attacks by Barbary pirates. In 1992, the tower was listed as an official historical monument of France. Since 1979, the tower has been owned and maintained by the French government agency, the Conservatoire du littoral. The agency plans to purchase 2,378 ha of the promontory and in 2011 had acquired 2,333 ha.
