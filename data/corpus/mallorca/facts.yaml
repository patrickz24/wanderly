  - id: mallorca-palma-de-mallorca-palma-cathedral
    name: Palma Cathedral
    kinds:
      - historic_site
      - museum
      - religious_site
    description: Huge ornate cathedral, impressive outside and within. It was started in 1229 but only completed in 1601, in mostly Gothic style; Gaudí had a go at improving it but quit in a strop. The Royal Chapel is the resting place of kings Jaime II and III. You can ascend the tower for an extra €15, but it's a lot of steps. The standard ticket includes Museo de Arte Sacro (aka Museu Diocesà), with religious paintings and silverware; this has a separate entrance east.
    crowd_level: null
    best_months: []
    source_ref: Palma de Mallorca > See > City centre
    crowd_evidence: []
    months_evidence: []
  - id: mallorca-palma-de-mallorca-royal-palace-of-la-almudaina
    name: Royal Palace of La Almudaina
    kinds:
      - historic_site
      - family
    description: The fortress dates back to Roman times but what you see now is a rebuild from 1309. The ground floor is medieval while the upper floor, added in the 16th century, has the grand state rooms and suites. It was a seat of the kings of Mallorca and is still used as a residence by the Spanish royal family.
