  - id: mallorca-churches
    name: Churches
    kinds:
      - religious_site
    description: 'Churches are the centrepiece of many other towns, often 17th century Baroque. The oddest is in Sa Servera near Cala Millor: the shell of an uncompleted Gothic church.'
    crowd_level: null
    best_months: []
    source_ref: See
  - id: mallorca-valldemossa
    name: Valldemossa
    kinds:
      - historic_site
      - religious_site
    description: Valldemossa Charterhouse was originally a royal palace then a monastery, then accommodation where Frédéric Chopin once stayed with George Sand.
    crowd_level: null
    best_months: []
    source_ref: See
  - id: mallorca-salbufera
    name: S'Albufera
    kinds:
      - nature
    description: S'Albufera is a salt marsh near Alcudia, where many bird species can be seen. Bird life can be seen at many other spots around the coast, such as the cliffs of Formentor.
    crowd_level: null
    best_months: []
    source_ref: See
  - id: mallorca-caves
    name: Caves
    kinds:
      - nature
    description: 'Caves: several are open to the public, such as the Dragon Caves near Cala Millor.'
    crowd_level: null
    best_months: []
    source_ref: See
  - id: mallorca-hiking
    name: Hiking
    kinds:
      - hiking
    description: 'Hiking: the principal trail is Ruta de Pedra (GR221, taking eight days along the northwest coast from Andratx to Port de Pollença.'
    crowd_level: null
    best_months: []
    source_ref: Do
  - id: mallorca-cycling
    name: Cycling
    kinds:
      - other
    description: 'Cycling: the main roads are ratty, get off into the lanes, and the gradients of Serra de Tramuntana will get your attention. Vuelta Ciclista a Mallorca is four days of racing in Jan / Feb, which pro teams use as a warm-up for their coming season.'
    crowd_level: null
    best_months: []
    source_ref: Do
  - id: mallorca-golf
    name: Golf
    kinds:
      - other
    description: 'Golf: some 18 courses are mainly in two areas, the Andratx - Calvià - Magaluf resorts west of Palma, and the Cala Ratjada - Sa Servera strip along the east coast.'
    crowd_level: null
    best_months: []
    source_ref: Do
  - id: mallorca-tennis
    name: Tennis
    kinds:
      - other
    description: 'Tennis: the Nadal tennis academy is at Manacor.'
    crowd_level: null
    best_months: []
    source_ref: Do
  - id: mallorca-beaches
    name: Beaches
    kinds:
      - beach
    description: 'Beaches: much of the coast is rocky. Sandy stretches attract a scrummage of boxy hotels and may be crowded. The best compromise may be in secluded coves, where the gradient to access and exit deters the crowds.'
    crowd_level: null
    best_months: []
    source_ref: Do
  - id: mallorca-scuba-diving
    name: Scuba diving
    kinds:
      - beach
      - nature
      - adventure
    description: Scuba diving is ideal for beginners and occasional divers. There's no river outflow so the water is clear, warm especially in late summer, and non-tidal. The convoluted coast means there's always a sheltered cove if the wind and waves pick up, as they often do in the afternoon. Mallorca main island suffers the usual Med problems of stripped coral, fished out, and unregulated coastal development. Cabrera island has the best diving, as it's a national park with protected habitat.
    crowd_level: null
    best_months: []
    source_ref: Do
  - id: mallorca-music
    name: Music
    kinds:
      - other
    description: 'Music: classical and other concerts are especially in summer, with some held open-air.'
    crowd_level: null
    best_months: []
    source_ref: Do
  - id: mallorca-climbing
    name: Climbing
    kinds:
      - adventure
    description: 'Climbing: the limestone bluffs of Serra de Tramuntana have plenty of climbing routes. "Psicobloc" is the specialty of rock climbing above deep water.'
    crowd_level: null
    best_months: []
    source_ref: Do
  - id: mallorca-fiestas
    name: Fiestas
    kinds:
      - historic_site
    description: 'Fiestas mostly have religious roots, with great Madonnas teetering in pomp down ancient streets. A few have always been secular: in Sóller, Es Firo in May involves pirates, enraged women, treacle and catapults. And Correfoc in August sees Sóller invaded by hellfire demons, until doused by the fire brigade.'
    crowd_level: null
    best_months: []
    source_ref: Do
  - id: mallorca-sailing-and-yachting
    name: Sailing and yachting
    kinds:
      - boat_trip
    description: 'Sailing and yachting: there are marinas at all the main coastal towns. Boat charter may be available.'
